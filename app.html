<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- UNION ONE WORK BOARD — 앱 화면 (깃허브에서 띄웁니다) -->
<title>UNION ONE WORK BOARD</title>
<style>
/* ===================== 색·글꼴 토큰 ===================== */
/* 층: 바탕(--bg) < 카드(--card) 는 밝게 뜨고, 입력칸(--field) 은 카드보다 파인다.
   글자: 값(--t1) > 본문(--t2) > 라벨(--t3). 라벨이 값보다 튀면 안 된다. */
:root{
  --bg:#EDEBE7; --card:#FFFFFF; --field:#F4F2EE;
  --panel:#E5E2DD; --panel2:#D8D3CD;
  --line:#DFDAD3; --line2:#C4BCB4;
  --t1:#14110D; --t2:#544D46; --t3:#8D867E;
  --dg-bg:#FDECEC; --dg-line:#E9A3A3; --dg:#A32020;
  --wn-bg:#FDF4E0; --wn-line:#E0B65C; --wn:#8A5A05;
  --ok:#127A4B; --accent:#D22B2B;

  /* ★ 정해진 단계 밖의 값은 쓰지 않는다 (v45).
     화면마다 px 를 직접 적으면 한 곳을 고칠 때 다른 곳이 어긋난다.
     새 화면을 만들 때도 아래 변수만 쓴다. PC 크기는 아래 미디어쿼리에서 변수만 올린다. */
  --fs-h1:15px;      /* 화면·모달 제목 */
  --fs-h2:13px;      /* 구역 제목 · 카드 제목 */
  --fs-body:12px;    /* 본문 */
  --fs-sm:11.5px;    /* 보조 — 라벨·날짜·작성자 */
  --fs-xs:10.5px;    /* 뱃지 */

  /* 숫자·아이콘은 글자 단계와 다른 축이다 (진행률·금액처럼 크게 보여주는 것) */
  --fs-num-lg:26px; --fs-num-md:19px; --fs-num-sm:14px;
  --fs-icon:16px; --fs-icon-lg:17px; --fs-cnt:9.5px; --fs-pin:22px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --r:var(--r-md); --r2:var(--r-lg);   /* 옛 이름 (쓰던 곳이 많아 남겨둔다) */
}
html[data-theme="dark"]{
  --bg:#0D0D10; --card:#1B1B21; --field:#131317;
  --panel:#212128; --panel2:#2C2C34;
  --line:#2C2C34; --line2:#3D3D47;
  --t1:#F4F4F7; --t2:#A6A6B0; --t3:#6B6B76;
  --dg-bg:#331A1C; --dg-line:#8A2A2E; --dg:#FFB3B3;
  --wn-bg:#312414; --wn-line:#8A6614; --wn:#FFD98A;
  --ok:#54D68C; --accent:#F05252;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable}        /* 스크롤바 유무로 화면이 밀리지 않게 */
html,body{margin:0;padding:0;background:var(--bg);color:var(--t1)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:var(--fs-body); line-height:1.55; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.005em;
}
h1,h2,h3,.tt,.num{font-family:"A2Z","A2Z Fallback",inherit; font-weight:700; letter-spacing:-0.01em}
button,input,select,textarea{font-family:inherit;font-size:var(--fs-body);color:var(--t1)}
a{color:inherit}

/* ===================== 공통 부품 ===================== */
.btn{border:1px solid var(--line2);background:var(--field);border-radius:var(--r);
  padding:9px 15px;cursor:pointer;font-size:var(--fs-body);white-space:nowrap;color:var(--t1)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.btn.pri:hover{opacity:.88}
.btn.dg{background:var(--dg-bg);color:var(--dg);border-color:var(--dg-line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:var(--fs-sm)}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;
  padding:4px 11px;cursor:pointer;font-size:var(--fs-sm);color:var(--t2)}
.chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.tag{display:inline-block;padding:2px 7px;border-radius:var(--r-sm);font-size:var(--fs-xs);line-height:1.5}
.tag.dg{background:var(--dg-bg);color:var(--dg)}
.tag.wn{background:var(--wn-bg);color:var(--wn)}
.tag.gy{background:var(--panel2);color:var(--t2)}
.muted{color:var(--t3)}
.sub{color:var(--t2)}
.card .cn{letter-spacing:-0.01em}
.colhead{color:var(--t1)}
.hide{display:none !important}
/* 입력칸은 카드보다 파인 자리로 보이게 한다 */
input[type=text],input[type=tel],input[type=number],input[type=date],
input[type=password],input[type=file],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--field);color:var(--t1);font-size:var(--fs-h2);outline:none;
  transition:border-color .12s ease, background .12s ease}
input:focus,select:focus,textarea:focus{border-color:var(--t2);background:var(--card)}
textarea{resize:vertical;min-height:76px;line-height:1.65;font-size:var(--fs-h2)}
/* 라벨은 작고 어둡게, 값은 크고 밝게 */
label.fl{display:block;font-size:var(--fs-xs);color:var(--t3);margin:0 0 6px;font-weight:500}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.req::after{content:" *";color:var(--accent)}
.err{border-color:var(--dg-line) !important;background:var(--dg-bg)}

/* 첫 방문 뼈대 — 데이터가 오기 전에 화면 모양을 먼저 보여준다 */
.sk{border:1px solid var(--line);border-radius:var(--r2);background:var(--card);
  padding:12px 14px;margin-bottom:7px}
.sk div{height:10px;border-radius:5px;background:var(--panel2);margin-bottom:8px}
.sk div:last-child{margin-bottom:0}
.skwrap{animation:fadeIn .2s ease-out both}
.skline{position:relative;overflow:hidden}
.skline::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
  animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}

/* ===================== 움직임 =====================
   원칙: 계속 움직이는 것은 없다. 처음 배치될 때와 화면이 바뀔 때만.
   transform 과 opacity 만 써서 60프레임을 유지한다. */
@keyframes riseIn{
  from{opacity:0;transform:translate3d(0,26px,0) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes sheetUp{
  from{opacity:0;transform:translate3d(0,60px,0) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes veilIn{ from{opacity:0} to{opacity:1} }
@keyframes growX{ from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes toastUp{
  from{opacity:0;transform:translate3d(-50%,12px,0)}
  to{opacity:1;transform:translate3d(-50%,0,0)}
}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(210,43,43,.45)}
  100%{box-shadow:0 0 0 12px rgba(210,43,43,0)}
}

.in{animation:riseIn .46s cubic-bezier(.16,.9,.28,1) both}
.viewin{animation:fadeIn .26s ease-out both}
.veil{animation:veilIn .2s ease-out}
.sheet{animation:sheetUp .38s cubic-bezier(.16,.9,.28,1)}
.bar > i{transform-origin:left center;animation:growX .95s cubic-bezier(.16,.9,.28,1) both}
.toast{animation:toastUp .2s ease-out}
.card.justnow{animation:flash .9s ease-out}

/* 눌렀을 때 반응 */
.btn:active,.chip:active,.navtabs button:active{transform:translateY(1px)}
.card{transition:border-color .18s ease, transform .22s cubic-bezier(.16,.9,.28,1), box-shadow .22s ease}
@media (hover:hover){
  .card:hover{transform:translateY(-3px)}
  html[data-theme="light"] .card:hover{box-shadow:0 8px 20px rgba(20,16,12,.14)}
  html[data-theme="dark"] .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.5)}
}
.rowline{transition:background .12s ease}
.rowline:hover{background:var(--panel)}
.icobtn{transition:background .12s ease, color .12s ease}

/* 접근성 설정에서 동작 줄이기를 켠 사람에게는 전부 끈다 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ===================== 상단바 ===================== */
.top{position:sticky;top:0;z-index:30;background:var(--card);
  border-bottom:1px solid var(--line);padding:9px 0;
  display:flex;justify-content:center}
.topin{width:100%;max-width:1680px;padding:0 18px;
  display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;
  border:none;background:transparent;padding:0}
.brand:hover b{opacity:.65}
.backbar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
@media (min-width:720px){ .backbar{display:none} }
.dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
.brand b{font-size:var(--fs-h2)}
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* 상단 화면전환 탭 — 가장 잘 보여야 하는 요소 */
.navtabs{display:flex;gap:2px;background:var(--panel);border-radius:99px;padding:3px}
.navtabs button{border:none;background:transparent;color:var(--t2);cursor:pointer;
  padding:7px 18px;border-radius:99px;font-size:var(--fs-h2);font-weight:600;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .12s,color .12s;
  min-width:88px}                     /* 폭 고정 — 선택돼도 옆 탭이 밀리지 않게 */
.navtabs button:hover{color:var(--t1)}
.navtabs button.on{background:var(--card);color:var(--t1);
  box-shadow:0 1px 3px rgba(0,0,0,.13)}
.navtabs .cnt{background:var(--accent);color:#fff;font-size:var(--fs-xs);font-weight:700;
  min-width:17px;height:17px;line-height:17px;border-radius:99px;padding:0 5px;text-align:center}

.clock{font-size:var(--fs-body);color:var(--t2);font-variant-numeric:tabular-nums;margin-right:2px}
@media (max-width:420px){ .clock{display:none} }
#refBtn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 공지 줄 — 상단바 바로 아래. 어느 화면에서나 보인다 */
.notice{background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;justify-content:center}
.noticein{width:100%;max-width:1680px;padding:5px 18px;
  display:flex;align-items:center;gap:10px}
.nlist{flex:1;min-width:0}
.nrow{display:flex;align-items:center;gap:7px;padding:1px 0;cursor:pointer;
  font-size:var(--fs-sm);line-height:1.65;white-space:nowrap;overflow:hidden}
.nrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nrow .w{flex-shrink:0}
.nrow.read{opacity:.45}
.nrow:hover .t{text-decoration:underline}
.nrow .tag{flex-shrink:0}
/* 폰에서는 맨 위 공지 한 줄만. 나머지는 게시판에서 본다 */
@media (max-width:719px){
  .nrow:nth-child(n+2){display:none}
  .nrow .w{display:none}
}

/* 접었다 펴는 구역 — 제목줄에 요약을 얹는다 */
.fold{border-top:1px solid var(--line)}
.fold > .fh{display:flex;align-items:center;gap:8px;width:100%;
  padding:12px 2px;background:transparent;border:none;color:var(--t1);
  font-size:var(--fs-body);font-weight:600;cursor:pointer;text-align:left}
.fold > .fh:hover{color:var(--t1)}
.fold > .fh .arrow{margin-left:auto;color:var(--t3);font-size:var(--fs-sm);
  transition:transform .18s ease}
.fold.open > .fh .arrow{transform:rotate(180deg)}
.fold > .fb{display:none;padding:0 2px 16px}
.fold.open > .fb{display:block;animation:foldIn .24s cubic-bezier(.16,.9,.28,1) both}
@keyframes foldIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* 안 읽은 댓글 표시 — 점 하나. 숫자는 쓰지 않는다 */
.cdot{display:inline-block;width:7px;height:7px;border-radius:99px;
  background:var(--dg);margin-left:5px;vertical-align:middle;flex-shrink:0}

/* 글 서식 (저장은 순수 글자, 보여줄 때만 서식) */
/* 글자 크기는 세 단계로만 쓴다 (v42)
     제목  .tt / .sheet h3      가장 크고 밝고 굵게
     본문  기본 (.mk 포함)      보통
     보조  .sub / .muted / .byline  작고 어둡게
   본문이 제목보다 커 보이면 안 되므로 .mk 크기를 못 박아둔다 */
.mk{margin:0 0 10px;line-height:1.75;font-size:var(--fs-body);color:var(--t1)}
.mk:last-child{margin-bottom:0}

/* ★ '누가 언제' 는 어느 화면에서든 제목 바로 아래 한 줄 (v42)
   업무 상세 · 공지 · 게시글 · 결재 문서 상세 · 댓글 · 기록 전부 이 모양을 쓴다 */
.byline{font-size:var(--fs-sm);color:var(--t3);margin:-8px 0 14px;line-height:1.7;
  word-break:keep-all}
.byline .hot{color:var(--dg)}
.byline .on{color:var(--t2)}
.byline + .byline{margin-top:-10px}
ul.mk,ol.mk{padding-left:20px}
ul.mk li,ol.mk li{margin:2px 0}

/* ── 글 서식 편집기 (v44) — 버튼을 누르면 그 자리에서 바로 굵어진다 ── */
.mkbar{display:flex;gap:4px;margin:0 0 6px}
.mkbar button{border:1px solid var(--line2);background:var(--field);border-radius:var(--r);
  padding:5px 8px;cursor:pointer;color:var(--t3);line-height:0;
  transition:background .12s,color .12s,border-color .12s}
.mkbar button svg{width:14px;height:14px;display:block}
.mkbar button:hover{background:var(--panel2);color:var(--t1)}
.mkbar button.on{background:var(--panel2);color:var(--t1);border-color:var(--t3)}
.mkin{border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;
  background:var(--field);color:var(--t1);font-size:var(--fs-h2);line-height:1.7;
  outline:none;overflow-y:auto;max-height:46vh;word-break:break-word}
.mkin:focus{border-color:var(--t2);background:var(--card)}
/* fmt() 가 넣어주는 .mk 는 본문용 12px 이다. 편집칸 안에서는 편집칸 크기를 따른다 */
.mkin p,.mkin ul,.mkin ol,.mkin li{font-size:inherit;line-height:inherit;color:inherit}
.mkin p{margin:0 0 8px}
.mkin p:last-child{margin-bottom:0}
.mkin ul,.mkin ol{padding-left:20px;margin:0 0 8px}
.mkin li{margin:2px 0}
.mkin:empty::before{content:"";display:block}
.mkin.one{min-height:0;max-height:26vh;padding:8px 11px}

/* 댓글 */
.cmt{padding:7px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:none}
.cmt .d{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);margin-bottom:2px}
.cmt .d .del{margin-left:auto;border:none;background:transparent;color:var(--t3);
  cursor:pointer;font-size:var(--fs-num-sm);line-height:1;padding:0 2px}
.cmt .body{line-height:1.7;font-size:var(--fs-body)}

/* 법인 필터 — 본문 위로 내려옴 */
.filterbar{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;
  height:34px;padding:0;margin:0 0 14px;border-bottom:1px solid var(--line)}
.filterbar::-webkit-scrollbar{display:none}

/* 다른 화면의 제목줄도 필터바와 같은 높이로 맞춰 화면 전환 시 안 흔들리게 */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  height:34px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.pagehead h3{margin:0;font-size:var(--fs-h1)}
.spacer{flex:1}
.icobtn{border:none;background:transparent;cursor:pointer;color:var(--t2);
  padding:5px 6px;border-radius:var(--r);font-size:var(--fs-h1);position:relative}
.icobtn:hover{background:var(--panel2)}
.badge{position:absolute;top:0;right:0;min-width:15px;height:15px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:var(--fs-cnt);line-height:15px;text-align:center;padding:0 3px}

/* ===================== 워크보드 ===================== */
.wrap{width:100%;max-width:1680px;margin:0 auto;padding:12px 18px 90px}
#view-doc.viewin,#view-me.viewin,#view-settings.viewin,#view-board.viewin{
  animation:riseIn .38s cubic-bezier(.16,.9,.28,1) both}
.board{display:grid;gap:10px}
.col > .colhead{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:var(--fs-h2);font-weight:600}
.colhead .n{color:var(--t3);font-weight:400}
.cards{display:flex;flex-direction:column;gap:7px}
@media (min-width:1080px){ #listRun .card{max-width:780px} }
#listRun .card{padding:14px 16px}
#listRun .card .cn{font-size:var(--fs-h1)}
#listRun .bar{height:8px;border-radius:var(--r-sm)}
#listRun .bar > i{background:linear-gradient(90deg,#12A15F,#1FBF74)}
#listRun .pct{font-size:var(--fs-num-sm);font-weight:700;font-family:"A2Z",inherit;color:var(--t1)}
#listRun .stats{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
#listRun .stats .k{font-size:var(--fs-sm);color:var(--t3)}
#listRun .stats .num{font-size:var(--fs-h2);font-weight:600;color:var(--t1)}
#listRun .lastline{font-size:var(--fs-h2);color:var(--t1);margin-top:11px;padding-top:9px}
#listRun .lastline .dt{color:var(--t3);font-size:var(--fs-sm);margin-right:6px}
#listRun .tag{font-size:var(--fs-sm);padding:3px 9px}
#listRun .card .meta{font-size:var(--fs-sm)}
.colhead .live{width:6px;height:6px;border-radius:99px;background:var(--ok);display:inline-block}

.card{border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;
  background:var(--card);cursor:pointer;transition:border-color .12s}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(20,16,12,.05)}
.card:hover{border-color:var(--t3)}
.card.dg{border-color:var(--dg-line);border-left:3px solid var(--dg)}
.card.wn{border-color:var(--wn-line);border-left:3px solid var(--wn)}
.card.done{opacity:.82}
.card .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .cn{font-size:var(--fs-h2);font-weight:600;margin:0}
.card .meta{font-size:var(--fs-sm);color:var(--t3);white-space:nowrap}
.bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.stats p{margin:0;font-size:var(--fs-sm)}
/* 라벨이 값보다 눈에 띄면 안 된다 (v42). 라벨은 어둡게, 값은 밝게 */
.stats .k{color:var(--t3)}
.stats .num{color:var(--t1);font-weight:600}
.lastline{margin:8px 0 0;padding-top:6px;border-top:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--t2)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.slim .cn{font-size:var(--fs-body)}
.slim .stats{display:none}

.rail{display:flex;flex-direction:column;gap:14px}
.rail h4{margin:0 0 7px;font-size:var(--fs-body);font-weight:600;color:var(--t1)}
.rail .row{display:flex;justify-content:space-between;font-size:var(--fs-body);padding:3px 0}
/* ── 최근 기록: 한 건 = 카드 하나 (v44) ── */
.rail .item{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);padding:9px 11px;margin-bottom:8px;line-height:1.5;
  font-size:var(--fs-sm);color:var(--t1);display:block}
.rail .item.gone{opacity:.72}
.rail .item .tt{margin:0 22px 2px 0;font-size:var(--fs-h2);font-weight:600;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .item .by{margin:0 0 4px;font-size:var(--fs-sm);color:var(--t3)}
.rail .item .tx{margin:0;font-size:var(--fs-sm);color:var(--t2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rail .item .tag{font-size:var(--fs-xs);padding:1px 6px;vertical-align:1px}
.rail .item > .del{position:absolute;top:5px;right:5px;opacity:0;transition:opacity .12s}
.rail .item:hover > .del,.rail .item:focus-within > .del{opacity:1}
.rail .item .del{border:none;background:transparent;color:var(--t3);cursor:pointer;
  font-size:var(--fs-h1);line-height:1;padding:1px 4px;border-radius:var(--r-sm)}
.rail .item .del:hover{background:var(--dg-bg);color:var(--dg)}
.apv{background:var(--dg-bg);color:var(--dg);border:1px solid var(--dg-line);
  border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:var(--fs-sm)}
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px}
.sumbox p{margin:0 0 2px;font-size:var(--fs-sm)}

/* ★ PC에서는 **변수 자체를 한 단계 올린다** (v45).
   예전에는 선택자마다 px 를 다시 적어서, 한 곳을 고치면 다른 곳이 어긋났다.
   이제 여기 다섯 줄만 고치면 화면 전체가 같이 움직인다. */
@media (min-width:1080px){
  :root{
    --fs-h1:16.5px; --fs-h2:14px; --fs-body:13px; --fs-sm:12px; --fs-xs:11px;
    --fs-num-sm:15px;
  }
}

/* PC */
@media (min-width:1080px){
  .board{grid-template-columns:minmax(0,.85fr) minmax(0,2.3fr) minmax(0,.85fr) 250px}
  .rail{border-left:1px solid var(--line);padding-left:12px}
  .wrap{padding-bottom:24px}
}
/* 태블릿 */
@media (min-width:720px) and (max-width:1079px){
  .board{grid-template-columns:1fr 1.7fr 1fr}
  .rail{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px;
    display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px}
}
/* 모바일 */
@media (max-width:719px){
  .board{grid-template-columns:1fr}
  .rail{border-top:1px solid var(--line);padding-top:12px}
  .slim .stats{display:none}
}

/* ===================== 하단 탭 (모바일) ===================== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 0 calc(9px + env(safe-area-inset-bottom));text-align:center}
.tabs button{border:none;background:transparent;cursor:pointer;color:var(--t3);font-size:var(--fs-xs)}
.tabs button.on{color:var(--t1);font-weight:600}
.tabs .ic{display:block;font-size:var(--fs-icon-lg);margin-bottom:2px}
@media (min-width:720px){ .tabs{display:none} }
.deskmenu{display:none}
@media (min-width:720px){ .deskmenu{display:flex} }

/* ===================== 시트/모달 ===================== */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:flex;
  align-items:flex-end;justify-content:center}
@media (min-width:720px){ .veil{align-items:center} }
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:720px){ .sheet{border-radius:16px;max-height:86vh;padding:22px 22px 24px} }
.sheet h3{margin:0 0 14px;font-size:var(--fs-h1)}
/* 모달 안 덩어리 사이를 넉넉히 띄운다 */
.sheet .actions{margin-top:18px}
.sheet h4{color:var(--t2)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheethead h3{margin:0}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1;padding:11px}

/* 카운터 */
.count{display:flex;align-items:center;gap:8px}
.count button{width:38px;height:38px;border:1px solid var(--line2);background:var(--field);
  border-radius:var(--r);font-size:var(--fs-icon);cursor:pointer}
.count span{min-width:34px;text-align:center;font-size:var(--fs-h1);font-weight:600}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{border:1px solid var(--line2);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:var(--fs-sm)}
.chks input{display:none}
.chks label.on{background:var(--t1);color:var(--bg);border-color:var(--t1)}

/* 진행률 슬라이더 */
.prog{border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;background:var(--field)}
.prog .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.prog .val{font-size:var(--fs-num-lg);font-weight:700;font-family:"A2Z",inherit;line-height:1}
.prog .st{font-size:var(--fs-sm);padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--t2)}
.prog .st.run{background:var(--wn-bg);color:var(--wn)}
.prog .st.done{background:var(--panel2);color:var(--ok)}
.prog input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
  background:transparent;margin:0;display:block}
.prog input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--panel2)}
.prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:99px;background:var(--t1);border:3px solid var(--bg);
  margin-top:-9px;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.prog input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--panel2)}
.prog input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:99px;
  background:var(--t1);border:3px solid var(--bg);cursor:pointer}
.prog .ticks{display:flex;justify-content:space-between;margin-top:4px;font-size:var(--fs-xs);color:var(--t3)}
.prog .quick{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.prog .quick button{border:1px solid var(--line2);background:var(--card);border-radius:99px;
  padding:4px 11px;font-size:var(--fs-sm);cursor:pointer;color:var(--t2)}
.prog .quick button:hover{background:var(--panel2)}

/* 정산 */
.settle{border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;
  background:var(--field);margin-bottom:16px}
.settle .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.settle .big{font-size:var(--fs-num-md);font-weight:700;font-family:"A2Z",inherit}
.settle .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  padding-top:10px;border-top:1px solid var(--line)}
.settle .grid p{margin:0;font-size:var(--fs-body)}
.settle .grid .k{color:var(--t3);font-size:var(--fs-sm)}
.settle .paybar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:9px 0 4px}
.settle .paybar i{display:block;height:100%;background:#12A15F}
.slrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-body)}
.slrow:last-of-type{border-bottom:none}
.slrow .tagk{font-size:var(--fs-sm);padding:2px 7px;border-radius:var(--r);background:var(--panel2);color:var(--t2)}
.slrow .tagk.add{background:var(--wn-bg);color:var(--wn)}
.slrow .tagk.pay{background:var(--bg-danger);color:var(--dg)}
html[data-theme="dark"] .slrow .tagk.pay{background:#12301F;color:#54D68C}
html[data-theme="light"] .slrow .tagk.pay{background:#E7F6EE;color:#127A4B}

/* 타임라인 */
.tl{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.tl .ev{margin-bottom:14px;position:relative}
.tl .ev::before{content:"";position:absolute;left:-17px;top:5px;width:7px;height:7px;
  border-radius:99px;background:var(--line2)}
.tl .d{font-size:var(--fs-sm);color:var(--t3);margin-bottom:2px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:7px 12px;font-size:var(--fs-h2);
  color:var(--t1)}
.kv .k{color:var(--t3);font-size:var(--fs-sm)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:80;
  background:var(--t1);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:var(--fs-body)}
.center{text-align:center;padding:40px 10px;color:var(--t3)}
.rowline{display:flex;justify-content:space-between;align-items:center;
  padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.rowline:last-child{border-bottom:none}

/* =====================================================================
   되풀이되는 덩어리 — 새 화면은 이 클래스만 쓴다 (v45)
   화면 코드에 style="font-size:..." 를 적지 마세요. 여기 없으면 여기에 만드세요.
   ===================================================================== */

/* ── 목록 한 줄: 제목 + 누가·언제 + 오른쪽 값 ── */
.lrow{display:flex;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-1);border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--panel)}
.lrow.plain{cursor:default}
.lrow.plain:hover{background:transparent}
.lrow > .m{flex:1;min-width:0}
.lrow .t{margin:0;font-size:var(--fs-body);font-weight:600;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .b{margin:2px 0 0;font-size:var(--fs-sm);color:var(--t3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow > .r{text-align:right;white-space:nowrap;flex:none}
.lrow .v{font-size:var(--fs-body);font-weight:600;color:var(--t1);
  font-family:"A2Z","A2Z Fallback",inherit}
.lrow .s{display:block;margin-top:3px}

/* ── 카드: 한 건을 통째로 묶어 보여줄 때 (결재 문서·최근 기록 등) ── */
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-3);margin-bottom:var(--sp-2);
  display:flex;align-items:flex-start;gap:var(--sp-3);cursor:pointer;
  transition:border-color .12s ease}
.ucard:hover{border-color:var(--t3)}
.ucard.plain{cursor:default}
.ucard.plain:hover{border-color:var(--line)}
.ucard.hot{border-left:3px solid var(--dg);border-color:var(--dg-line)}
.ucard > .m{flex:1;min-width:0}
.ucard .t{margin:0;font-size:var(--fs-h2);font-weight:600;color:var(--t1);
  font-family:"A2Z","A2Z Fallback",inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .b{margin:3px 0 0;font-size:var(--fs-sm);color:var(--t3)}
.ucard .x{margin:var(--sp-2) 0 0;font-size:var(--fs-body);color:var(--t2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ucard > .r{text-align:right;white-space:nowrap;flex:none}
.ucard .v{display:block;font-size:var(--fs-h2);font-weight:700;color:var(--t1);
  font-family:"A2Z","A2Z Fallback",inherit}
.ucard .s{display:block;margin-top:var(--sp-1)}

/* ── 구역 제목 + 개수 ── */
.sec{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-5) 0 var(--sp-2)}
.sec:first-child{margin-top:0}
.sec h4,.sech{margin:0;font-size:var(--fs-h2);font-weight:600;color:var(--t1)}
.sech{margin:var(--sp-5) 0 var(--sp-2)}
.sech.hot{color:var(--dg)}
.sec .n{font-size:var(--fs-sm);color:var(--t3);font-family:"A2Z","A2Z Fallback",inherit}

/* ── 비어 있음 ── */
.none{margin:0;padding:var(--sp-2) var(--sp-1);font-size:var(--fs-sm);color:var(--t3)}
.none.big{padding:var(--sp-6) var(--sp-1);text-align:center}

/* 의미를 가진 색은 둘뿐 — 빨강(지금 손댈 것) · 노랑(곧 문제) */
.dgv{color:var(--dg)}
.wnv{color:var(--wn)}
.secw{margin:0 0 var(--sp-1);font-size:var(--fs-body);font-weight:600;color:var(--wn)}

/* ── 한 칸짜리 화면(결재·내 업무·설정) 의 폭 ──
   글이 가운데 좁게 몰리지 않게 넓게 두되, 한 줄이 너무 길어지지도 않게 한다 */
.page{max-width:1080px}
</style>
</head>
<body>

<!-- ================= 상단바 ================= -->
<div class="top"><div class="topin">
  <button class="brand" onclick="go('board')" title="워크보드로">
    <span class="dot"></span><b class="tt" id="brandName">UNION ONE</b></button>

  <nav class="navtabs deskmenu" aria-label="화면 이동">
    <button data-view="board" onclick="go('board')">워크보드</button>
    <button data-view="doc" onclick="go('doc')">결재<span class="cnt hide" id="navDoc">0</span></button>
    <button data-view="me" onclick="go('me')">내 업무</button>

  <div class="spacer"></div>
  <span class="clock" id="atTime"></span>
  <button class="icobtn" id="refBtn" onclick="refresh(true)" title="새로고침">⟳</button>
  <button class="icobtn" onclick="openNoti()" title="알림">🔔<span class="badge hide" id="notiBadge">0</span></button>
  <button class="icobtn" onclick="go('settings')" title="설정">⚙</button>
</div></div>

<!-- ================= 공지 줄 (탭이 아니라 한 줄 + 모달) ================= -->
<div class="notice hide" id="noticeBar"><div class="noticein">
  <div class="nlist" id="noticeList"></div>
  <button class="btn sm" onclick="openBoard()">게시판</button>
</div></div>

<div class="wrap">
  <!-- ================= 워크보드 ================= -->
  <div id="view-board">
    <div class="filterbar" id="corpFilter"></div>
    <div class="board">
      <div class="col"><div class="colhead">대기 <span class="n" id="cWait">0</span></div>
        <div class="cards slim" id="listWait"></div></div>
      <div class="col"><div class="colhead"><span class="live"></span>진행중 <span class="n" id="cRun">0</span></div>
        <div class="cards" id="listRun"></div></div>
      <div class="col"><div class="colhead">완료 <span class="n">최근 30일</span>
        <button class="btn sm" style="margin-left:auto;padding:3px 9px" onclick="openDoneAll()">전체 보기</button></div>
        <div class="cards slim" id="listDone"></div></div>
      <div class="rail">
        <div><h4 id="apvTitle" class="dgv">결재 대기</h4><div id="railApv"></div></div>
        <div><h4>오늘 출근</h4><div id="railAtt"></div></div>
        <div><h4>방금 올라온 기록</h4><div id="railLog"></div></div>

  <!-- ================= 결재 ================= -->

  <div id="view-settings" class="hide page">
    <div class="backbar"><button class="btn sm" onclick="go('board')">← 워크보드</button></div>

    <div class="field">
      <label class="fl">화면 밝기</label>

        <label data-v="auto"><input type="radio" name="th">자동</label>
        <label data-v="light"><input type="radio" name="th">밝게</label>

      </div>

      <label class="fl">속도</label>

        <button class="btn sm" onclick="PERF=[];paintPerf()">지우기</button>

<!-- ================= 하단 탭 ================= -->
<div class="tabs">
  <button data-view="board" class="on" onclick="go('board')"><span class="ic">▦</span>워크보드</button>
  <button data-view="log" onclick="openLogForm()"><span class="ic">✎</span>기록</button>
  <button data-view="doc" onclick="go('doc')"><span class="ic">▤</span>결재</button>
  <button data-view="me" onclick="go('me')"><span class="ic">◉</span>내 업무</button>

<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===================== 상태 ===================== */
var S = { token:'', me:null, meta:null, corp:'ALL', data:null, view:'board',
          lastUpdate:'', timer:null, anim:true, seen:{},
          taskCache:{}, docCache:{}, docCacheAt:{}, postCache:null, postCacheAt:null,
          readers:{}, readSent:{}, setCache:null, lastSync:0, lastT:null };

/* 상세 창에서 무엇을 펼쳐뒀는지. 창을 새로 열면 비운다 */
var FOLD={};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/**
 * 저장은 순수 글자로 한다. 보여줄 때만 표시를 서식으로 바꾼다.
 * 먼저 전부 무해한 글자로 바꾸므로 <b> 같은 걸 쳐도 태그로 살아나지 않는다.
 *   *굵게*  _밑줄_  "- " 글머리 목록  "1. " 번호 목록  빈 줄 문단  줄바꿈 그대로
 */
function fmt(s){
  var lines=esc(s).split(/\r?\n/);
  var html='', para=[], list=[], listTag='';

  function inline(x){
    return x.replace(/\*([^*]+)\*/g,'<b>$1</b>').replace(/_([^_]+)_/g,'<u>$1</u>');
  }
  function flushList(){
    if(!list.length) return;
    html+='<'+listTag+' class="mk">'+
      list.map(function(x){ return '<li>'+inline(x)+'</li>'; }).join('')+'</'+listTag+'>';
    list=[]; listTag='';
  }
  function flushPara(){
    if(!para.length) return;
    html+='<p class="mk">'+para.map(inline).join('<br>')+'</p>';
    para=[];
  }
  function push(tag, text){
    if(listTag && listTag!==tag) flushList();
    flushPara();
    listTag=tag; list.push(text);
  }

  lines.forEach(function(ln){
    var t=ln.replace(/\s+$/,'');
    if(/^\s*-\s+/.test(t)){ push('ul', t.replace(/^\s*-\s+/,'')); return; }
    if(/^\s*\d{1,3}\.\s+/.test(t)){ push('ol', t.replace(/^\s*\d{1,3}\.\s+/,'')); return; }
    flushList();
    if(!t.trim()){ flushPara(); return; }
    para.push(t);
  });
  flushList(); flushPara();
  return html;
}

/* ===================== 글 서식 편집기 (v44) =====================
   예전에는 *굵게* 라고 글자가 남고 저장해야 굵어졌다. 그게 구식으로 느껴진 진짜 이유다.

/** 서식 버튼 줄 */
function mkBar(id){

function mkCmd(id, cmd){

/** 지금 켜져 있는 서식을 버튼에 눌린 상태로 보여준다 */

    var on=false;

function mkKey(e, id){
  if(!(e.ctrlKey||e.metaKey)) return;
  var k=String(e.key||'').toLowerCase();

  else if(k==='u'){ e.preventDefault(); mkCmd(id,'underline'); }

/** 붙여넣기 — 굵게·밑줄·목록만 남기고 색·글꼴·크기는 전부 버린다 */
function mkPaste(e){
  e.preventDefault();
  var dt=e.clipboardData||window.clipboardData;
  if(!dt) return;
  var html=dt.getData('text/html')||'';
  var text=dt.getData('text/plain')||'';
  var clean = html ? mkClean(html) : esc(text).replace(/\r?\n/g,'<br>');
  try{ document.execCommand('insertHTML', false, clean); }catch(err){}
}

var MK_KEEP={B:1,STRONG:1,U:1,UL:1,OL:1,LI:1,BR:1,P:1,DIV:1};

function mkClean(html){
  var body;
  try{
    // DOMParser 로 만든 문서는 살아 있지 않다 (그림을 불러오거나 코드가 돌지 않는다)
    body=new DOMParser().parseFromString(html,'text/html').body;
  }catch(e){ return ''; }

  (function walk(node){
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3) return;                    // 글자는 그대로
      if(n.nodeType!==1){ if(n.parentNode) n.parentNode.removeChild(n); return; }
      walk(n);
      if(!MK_KEEP[n.tagName]){
        while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);   // 태그만 벗긴다
        n.parentNode.removeChild(n);
        return;
      }
      [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name); });
    });
  })(body);
  return body.innerHTML;
}

/**
 * 편집칸의 내용을 저장할 표시글로 바꾼다 (HTML 을 시트에 넣지 않는다).
 *   <b>  → *글*      <u>  → _글_
 *   <ul> → '- 글'    <ol> → '1. 글'
 */
function mkValue(id){
  var el=$(id);
  if(!el) return '';
  if(el.tagName==='TEXTAREA'||el.tagName==='INPUT') return el.value;   // 옛 칸도 그대로 받는다

  function inline(node){
    var s='';
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3){ s+=n.nodeValue; return; }
      if(n.nodeType!==1) return;
      var t=n.tagName;
      if(t==='BR'){ s+='\n'; return; }
      var inner=inline(n);
      if(!inner.trim()){ s+=inner; return; }
      if(t==='B'||t==='STRONG') s+='*'+inner+'*';
      else if(t==='U') s+='_'+inner+'_';
      else s+=inner;
    });
    return s;
  }

  var out=[];
  (function block(node){
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3){ if(n.nodeValue.replace(/\u200B/g,'').trim()) out.push(n.nodeValue); return; }
      if(n.nodeType!==1) return;
      var t=n.tagName;
      if(t==='UL'||t==='OL'){
        var i=1;
        [].slice.call(n.children).forEach(function(li){
          if(li.tagName!=='LI') return;
          out.push((t==='OL'? (i++)+'. ' : '- ')+inline(li).replace(/\n/g,' ').trim());
        });
        return;
      }
      if(t==='BR'){ out.push(''); return; }
      if((t==='DIV'||t==='P') && n.querySelector('ul,ol')){ block(n); return; }
      out.push(inline(n));
    });
  })(el);

  return out.join('\n').replace(/\u200B/g,'').replace(/\n{3,}/g,'\n\n').trim();
}
/* ===================== 짧은 날짜 · 누가 언제 한 줄 (v42) ===================== */

/**
 * 날짜를 짧게. 올해면 MM-DD, 작년 것이면 YYYY-MM-DD.
 * 시각이 붙어 있으면 그대로 살린다 ('2026-08-25 16:25' → '08-25 16:25')
 */
function shortDate(v){
  var s=String(v==null?'':v).trim();
  if(s.length<10) return s;
  var y=s.substring(0,4), md=s.substring(5,10), rest=s.substring(10).trim();
  if(!/^\d{4}$/.test(y)) return s;
  var head = (y===String(new Date().getFullYear())) ? md : (y+'-'+md);
  return rest ? (head+' '+rest) : head;
}

/** 오늘보다 이전인가 (마감 지남 판정) */
function isPast(d){
  var s=String(d||'').substring(0,10);
  return !!s && s<todayStr();
}

/**
 * '누가 언제 · 무엇' 한 줄.
 * parts 는 문자열이거나 {t:'마감 08-28', hot:true} 모양.
 * 빈 값은 아예 만들지 않는다 (하이픈이나 '없음' 을 남기지 마라).
 */
function byline(parts){
  var out=[];
  (parts||[]).forEach(function(p){
    if(!p) return;
    if(typeof p==='string'){ if(p.trim()) out.push(esc(p)); return; }
    if(!p.t || !String(p.t).trim()) return;
    out.push('<span class="'+(p.hot?'hot':(p.on?'on':''))+'">'+esc(p.t)+'</span>');
  });
  if(!out.length) return '';
  return '<p class="byline">'+out.join(' · ')+'</p>';
}

function won(n){ if(!n) return '0'; return Number(n).toLocaleString('ko-KR'); }

/** 60000 -> '6만원' / 1250000 -> '125만원' / 130000000 -> '1억 3000만원' */
function wonKo(n){
  n=Number(n||0);
  if(!n) return '';
  if(n<10000) return won(n)+'원';
  var eok=Math.floor(n/100000000);
  var man=Math.floor((n%100000000)/10000);
  var rest=n%10000;
  var t='';
  if(eok) t+=eok+'억';
  if(man) t+=(t?' ':'')+man.toLocaleString('ko-KR')+'만';
  if(rest) t+=(t?' ':'')+rest.toLocaleString('ko-KR');
  return t+'원';
}

/** 금액 칸: 숫자만 남기고 쉼표를 넣어주며 아래에 한글 금액을 보여준다 */
function moneyInput(el){

  el.value = raw? Number(raw).toLocaleString('ko-KR') : '';
  var hint=document.getElementById(el.id+'_ko');
  if(hint) hint.textContent = raw? wonKo(raw) : '';
  sumItems();

function moneyVal(el){ return Number(String(el.value).replace(/[^0-9]/g,'')||0); }

function sumItems(){

  [].forEach.call(box.querySelectorAll('.itAmt'),function(i){ sum+=moneyVal(i); });

  if(t) t.innerHTML='합계 <b class="num">'+won(sum)+'원</b>'+(sum?' <span class="sub">· '+wonKo(sum)+'</span>':'');

function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }

function toast(msg){
  var t=$('toast'); t.innerHTML='<div class="toast">'+esc(msg)+'</div>';

/* ------------------------------------------------------------------
 *  서버 주소 — 앱스스크립트를 새로 배포해서 주소가 바뀌면 이 줄만 고치세요
 * ---------------------------------------------------------------- */
var API_URL = 'https://script.google.com/macros/s/AKfycbxV8Mnhk5TzjaSgruNifLygp5AW8aOR5DZqwZ-3SvJJgecEnEAz9j2WN-AGywg2smou/exec';

var PERF=[];

/* 서버 호출.
   Content-Type 을 text/plain 으로 보내야 브라우저가 사전확인(OPTIONS)을
   보내지 않는다. application/json 으로 보내면 앱스스크립트에서 전부 실패한다. */
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var t0 = Date.now();

  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args, key: LAUNCH_TOKEN }),
    redirect: 'follow',
    cache: 'no-store'
  })
  .then(function(res){ return res.text(); })
  .then(function(text){
    var r;
    try { r = JSON.parse(text); }
    catch(e){ throw new Error('서버 응답을 읽지 못했습니다.'); }

    var ms = Date.now()-t0;
    var server = (r && r.ms) ? r.ms : (r && r.board && r.board.ms ? r.board.ms : null);
    PERF.push({fn:fn, ms:ms, server:server});
    if(PERF.length>50) PERF.shift();
    var tag = (ms>2000?'느림':(ms>1200?'보통':'빠름'));
    console.log('[속도] '+fn+' '+(ms/1000).toFixed(2)+'초'+
      (server!=null? ' (서버 '+(server/1000).toFixed(2)+'초, 통신 '+((ms-server)/1000).toFixed(2)+'초)':'')+
      ' · '+tag);

    var tt = (r && r.t) ? r.t : (r && r.board && r.board.t ? r.board.t : null);
    if(tt){ S.lastT=tt; S.lastTFn=fn; printT(fn, tt, ms); }

    /* 서버가 거절한 경우도 그대로 돌려준다.
       화면 쪽에서 ok 를 보고 판단한다. 여기서 자동 재시도는 하지 않는다. */
    return r;
  })
  .catch(function(e){
    console.log('[속도] '+fn+' 실패 '+((Date.now()-t0)/1000).toFixed(2)+'초', e);
    toast('통신 오류가 발생했습니다. 새로고침해주세요.');
    throw e;
  });
}

/**
 * 서버가 보내준 구간별 시간을 콘솔에 표로 찍는다 (v37m).
 *   ms   라벨별 밀리초       n    실행 횟수
 *   hit  캐시가 막아낸 횟수  rows 시트별 줄 수
 */
function printT(fn, t, wall){
  try{
    var rows=[];
    Object.keys(t.ms||{}).forEach(function(k){
      var sheet=k.split(':')[1]||'';
      var info=(t.rows||{})[sheet];
      rows.push({
        구간:k,
        ms:t.ms[k],
        횟수:(t.n||{})[k]||1,
        캐시적중:(t.hit||{})[k]||0,
        줄수:info?info.rows:'',
        열수:info?info.cols:''
      });
    });
    rows.sort(function(a,b){ return b.ms-a.ms; });
    var sheetMs=0, stepMs=0;
    rows.forEach(function(r){
      if(r.구간.indexOf('합계:')===0) return;
      if(/^(시트|머리글|손잡이|열기|쓰기|행삭제|속성|캐시):/.test(r.구간)) sheetMs+=r.ms;
      else stepMs+=r.ms;
    });
    console.groupCollapsed('[구간] '+fn+' 서버 '+t._total+'ms '+
      '(구글 호출 '+sheetMs+'ms + 우리 계산 '+stepMs+'ms) · 왕복 '+wall+'ms');
    console.table(rows);
    var hits=[];
    Object.keys(t.hit||{}).forEach(function(k){ hits.push({대상:k, 캐시가막아낸횟수:t.hit[k]}); });
    if(hits.length){ console.log('캐시 적중 (0 이면 캐시가 놀고 있는 것)'); console.table(hits); }
    console.groupEnd();
  }catch(e){}
}

/** 콘솔에서 perf() 를 치면 최근 동작별 평균 속도가 나옵니다 */
function perf(){
  var g={};
  PERF.forEach(function(p){
    if(!g[p.fn]) g[p.fn]={n:0,sum:0,max:0};
    g[p.fn].n++; g[p.fn].sum+=p.ms; g[p.fn].max=Math.max(g[p.fn].max,p.ms);
  });
  var rows=Object.keys(g).map(function(k){
    return {동작:k, 횟수:g[k].n, 평균초:(g[k].sum/g[k].n/1000).toFixed(2), 최대초:(g[k].max/1000).toFixed(2)};
  }).sort(function(a,b){ return b.평균초-a.평균초; });
  console.table(rows);
  return rows;
}

/** 마지막 응답에서 서버가 무엇에 몇 초를 썼는지 (구간별·시트별) */
function serverBreakdown(){
  var t=S.lastT;
  if(!t || !t.ms) return '';
  var rows=[], google=0, ours=0;
  Object.keys(t.ms).forEach(function(k){
    if(k.indexOf('합계:')===0) return;
    var sheet=k.split(':')[1]||'';
    var info=(t.rows||{})[sheet];
    rows.push({ k:k, ms:t.ms[k], n:(t.n||{})[k]||1, rows:info?info.rows:null });
    if(/^(시트|머리글|손잡이|열기|쓰기|행삭제|속성|캐시):/.test(k)) google+=t.ms[k]; else ours+=t.ms[k];
  });
  rows.sort(function(a,b){ return b.ms-a.ms; });
  if(!rows.length) return '';

  var h='<p class="muted" style="font-size:var(--fs-sm);margin:0 0 4px">'+
        esc(S.lastTFn||'')+' · 서버 안에서 '+((t._total||0)/1000).toFixed(2)+'초 '+
        '(구글 호출 '+(google/1000).toFixed(2)+'초 + 우리 계산 '+(ours/1000).toFixed(2)+'초)</p>';
  rows.slice(0,16).forEach(function(r){
    var slow = r.ms>500 ? 'var(--dg)' : (r.ms>250 ? 'var(--wn)' : '');
    h+='<p style="display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm)">'+
       '<span class="muted">'+esc(r.k)+
         (r.rows!=null? ' <span class="muted">'+r.rows+'줄</span>':'')+
         (r.n>1? ' <span class="muted">×'+r.n+'</span>':'')+'</span>'+
       '<span class="num" style="color:'+slow+'">'+r.ms+'ms</span></p>';
  });
  return h+'<div style="height:10px;border-bottom:1px solid var(--line);margin-bottom:8px"></div>';
}

/** 콘솔을 열지 않고 설정 화면에서 바로 보는 속도표 */
function paintPerf(){
  var box=$('perfBox'); if(!box) return;
  var g={};
  PERF.forEach(function(p){
    if(!g[p.fn]) g[p.fn]={n:0,sum:0,max:0,srv:0,srvN:0};
    g[p.fn].n++; g[p.fn].sum+=p.ms; g[p.fn].max=Math.max(g[p.fn].max,p.ms);
    if(p.server!=null){ g[p.fn].srv+=p.server; g[p.fn].srvN++; }
  });
  var rows=Object.keys(g).map(function(k){
    var x=g[k];
    return { fn:k, n:x.n, avg:x.sum/x.n/1000, max:x.max/1000,
             srv: x.srvN? (x.srv/x.srvN/1000) : null };
  }).sort(function(a,b){ return b.avg-a.avg; });

  if(!rows.length){
    box.innerHTML='<p class="sub">아직 잰 것이 없습니다. 앱을 좀 쓰고 다시 보세요.</p>';
    return;
  }
  var h=serverBreakdown();
  rows.forEach(function(r){
    var slow = r.avg>2 ? 'var(--dg)' : (r.avg>1.2 ? 'var(--wn)' : '');
    h+='<p style="display:flex;justify-content:space-between;gap:10px">'+
       '<span class="sub" style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+
       esc(r.fn.replace('api_',''))+' <span class="muted">×'+r.n+'</span></span>'+
       '<span class="num" style="white-space:nowrap;color:'+slow+'">'+
       r.avg.toFixed(2)+'초'+
       (r.srv!=null? ' <span class="muted" style="font-weight:400">(서버 '+r.srv.toFixed(2)+')</span>':'')+
       '</span></p>';
  });
  box.innerHTML=h;
}

/* ===================== 테마 ===================== */
function applyTheme(){
  var mode = localStorage.getItem('ncore_theme') || 'auto';
  var real = mode;
  if(mode==='auto'){ var h=new Date().getHours(); real = (h>=19||h<7) ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', real);
  var box=$('themePick');
  if(box){ [].forEach.call(box.children,function(l){ l.classList.toggle('on', l.dataset.v===mode); }); }
}
function setTheme(v){ localStorage.setItem('ncore_theme',v); applyTheme(); }

function loadFont(bold, medium){
  if(!bold && !medium) return;
  var css='';
  if(bold)   css+='@font-face{font-family:"A2Z";src:url("'+bold+'") format("woff2");font-weight:700;font-display:swap}';
  if(medium) css+='@font-face{font-family:"A2Z";src:url("'+medium+'") format("woff2");font-weight:500;font-display:swap}';
  if(!medium && bold) css+='@font-face{font-family:"A2Z";src:url("'+bold+'") format("woff2");font-weight:500;font-display:swap}';
  var st=document.createElement('style');
  st.textContent=css;
  document.head.appendChild(st);
}

/* ===================== 시작 ===================== */
/* 런처(홈 화면 아이콘)로 들어온 경우 런처가 준 기기 식별값을 쓴다.
   브라우저로 직접 들어온 경우에는 이 값이 비어 있고, 앱이 스스로 만든다. */
var LAUNCH_TOKEN = (function () {
  try {
    var m = location.search.match(/[?&]dt=([^&]+)/);
    if (m && m[1]) return decodeURIComponent(m[1]);
    return localStorage.getItem('unionone_device_v1') || '';
  } catch (e) { return ''; }
})();

/* 마지막으로 본 화면을 이 기기에 저장해둔다.
   다음에 열 때 서버를 기다리지 않고 바로 그려서 체감 대기를 없앤다. */
var SNAP='ncore_snap_v6';

function saveSnap(){
  try{
    if(!S.data) return;
    var d=S.data;
    // 어느 댓글까지 봤는지만 따로 챙긴다 (안 그러면 새로고침할 때마다 점이 되살아난다)
    /* 댓글 배지는 이제 서버가 판정해서 cmtDot 으로 준다 (v44).
       화면 변수(S.seen)에 담아 저장하던 것을 없앴다 — 그게 다른 기기와 결과가 달랐던 원인이다. */
    localStorage.setItem(SNAP, JSON.stringify({
      t:Date.now(), me:S.me, meta:S.meta, corp:S.corp,
      data:{ ok:true, me:d.me, tasks:d.tasks, approvals:d.approvals,
             attendance:d.attendance, recent:d.recent, stat:d.stat,
             statByCorp:d.statByCorp, noti:d.noti, at:d.at,
             // 업무 상세·결재 탭·공지·댓글을 왕복 없이 열기 위한 재료도 같이 저장한다
             logsByTask:d.logsByTask, logCount:d.logCount,
             docsByTask:d.docsByTask, settle:d.settle, docs:d.docs, docPack:d.docPack,
             notices:d.notices, commentsByTask:d.commentsByTask, commentCount:d.commentCount,
             cmtDot:d.cmtDot,     // 안 읽은 댓글 배지 (서버 판정, v44)
             vers:d.vers }        // 분야별 번호표도 같이 (다음 접속 때 캐시 판정에 쓴다)
    }));
  }catch(e){}
}

function loadSnap(){
  try{
    var raw=localStorage.getItem(SNAP);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o || !o.data || !o.me) return null;
    if(Date.now()-o.t > 1000*60*60*24*3) return null;   // 3일 지난 건 버린다
    return o;
  }catch(e){ return null; }
}

function markStale(on){
  var el=$('atTime'); if(!el) return;
  el.style.opacity = on ? '.45' : '';
  el.title = on ? '이전 화면입니다. 새 데이터를 받는 중' : '';
}

function boot(){
  applyTheme();

  if(LAUNCH_TOKEN){
    S.token = LAUNCH_TOKEN;
    try{ localStorage.setItem('ncore_token', S.token); }catch(e){}
  } else {
    try{ S.token = localStorage.getItem('ncore_token') || ''; }catch(e){ S.token=''; }
    if(!S.token){
      S.token = 'T'+Date.now()+Math.random().toString(36).substr(2,7);
      try{ localStorage.setItem('ncore_token', S.token); }catch(e){}
    }
  }
  // ① 지난번 화면이 있으면 먼저 그린다 (서버를 기다리지 않음)
  var snap=loadSnap();
  if(snap){
    S.meta=snap.meta; S.me=snap.me; S.corp=snap.corp||'ALL'; S.data=snap.data;
    takeDocPack(S.data);          // 지난번에 받아둔 문서 상세도 되살린다
    $('brandName').textContent=(S.meta.company||'UNION ONE').replace('(주)','').trim()||'UNION ONE';
    loadFont(S.meta.fontTitle, S.meta.fontNum);
    renderFilters();
    S.anim=true;
    renderBoard();
    renderNotices();
    $('atTime').textContent=S.data.at||'';
    navCount(); showNoti(S.data.noti);
    markStale(true);
    hideBooting();
  } else {
    showSkeleton();
  }

  // ② 진짜 데이터는 왕복 한 번으로 받는다
  call('api_start', S.token, S.corp).then(function(r){
    if(r.meta){
      S.meta=r.meta;
      $('brandName').textContent=(r.meta.company||'UNION ONE').replace('(주)','').trim()||'UNION ONE';
      loadFont(r.meta.fontTitle, r.meta.fontNum);
    }
    hideBooting();
    if(!r.ok){ markStale(false); showLogin(); return; }
    renderFilters();
    S.anim = !snap;              // 스냅샷을 이미 그렸으면 조용히 갈아끼운다
    applyBoard(r);
    markStale(false);
    saveSnap();
    startPolling();
  });
}

/* 엔터를 누르면 다음 단계로 넘어간다.
   한글 입력 중(조합 중)에 눌린 엔터는 무시한다. */
function enterGo(ev, fn){
  if(!ev) return;
  if(ev.key !== 'Enter' && ev.keyCode !== 13) return;
  if(ev.isComposing || ev.keyCode === 229) return;
  ev.preventDefault();
  try { fn(); } catch(e){}
}

function stepPhone(){
  var v=$('lgPhone').value.replace(/[^0-9]/g,'');
  if(v.length<10){ $('lgMsg').textContent='번호를 정확히 입력해주세요.'; return; }
  $('lgNextBtn').disabled=true; $('lgMsg').textContent='확인 중입니다...';
  call('api_checkPhone', v).then(function(r){
    $('lgNextBtn').disabled=false;
    if(!r.ok){
      $('lgMsg').textContent=r.msg;
      var box=$('lgSignup');
      if(box){
        box.innerHTML = (r.code==='NOT_FOUND')
          ? '<div class="actions" style="margin-top:6px">'+
            '<button class="btn" onclick="showSignup(\''+v+'\')">처음이신가요? 사용 신청</button></div>'
          : '';
      }
      return;
    }
    showPinStep(v, r.name, r.hasPin);
  });
}

function showPinStep(phone, name, hasPin){
  var first = !hasPin;
  $('modal').innerHTML =
   '<div class="veil"><div class="sheet">'+
   '<h3 class="tt">'+esc(name)+'님</h3>'+
   '<div class="field"><label class="fl req">'+(first?'새 PIN 4자리':'PIN')+'</label>'+
   '<input type="password" id="lgPin" maxlength="4" inputmode="numeric" '+
     'onkeydown="enterGo(event, function(){ doLogin(\''+phone+'\','+(first?'true':'false')+'); })" '+
     'style="font-size:var(--fs-pin);letter-spacing:10px;text-align:center;padding:12px"></div>'+
   (first? '<div class="field"><label class="fl req">PIN 다시 입력</label>'+
     '<input type="password" id="lgPin2" maxlength="4" inputmode="numeric" '+
     'onkeydown="enterGo(event, function(){ doLogin(\''+phone+'\',true); })" '+
     'style="font-size:var(--fs-pin);letter-spacing:10px;text-align:center;padding:12px"></div>' : '')+
   '<div class="actions"><button class="btn" onclick="showLogin()">뒤로</button>'+
   '<button class="btn pri" id="lgGo" onclick="doLogin(\''+phone+'\','+(first?'true':'false')+')">'+
     (first?'설정하고 시작':'로그인')+'</button></div>'+
   '<p class="muted" id="lgMsg" style="margin-top:10px"></p></div></div>';
  setTimeout(function(){ var e=$('lgPin'); if(e) e.focus(); }, 200);
}

function doLogin(phone, first){
  var pin=$('lgPin').value.replace(/[^0-9]/g,'');
  if(pin.length!==4){ $('lgMsg').textContent='숫자 4자리를 입력해주세요.'; return; }
  if(first){
    var p2=$('lgPin2').value.replace(/[^0-9]/g,'');
    if(pin!==p2){ $('lgMsg').textContent='두 번 입력한 PIN이 다릅니다.'; return; }
    if(/^(\d)\1{3}$/.test(pin) || pin==='1234' || pin==='0000'){
      $('lgMsg').textContent='너무 쉬운 번호입니다. 다른 번호로 정해주세요.'; return;
    }
  }
  $('lgGo').disabled=true; $('lgMsg').textContent='확인 중입니다...';
  call('api_login', phone, pin, S.token).then(function(r){
    $('lgGo').disabled=false;
    if(!r.ok){ $('lgMsg').textContent=r.msg; return; }
    S.me=r.me; $('modal').innerHTML='';
    renderFilters();
    showSkeleton();
    call('api_start', S.token, S.corp).then(function(b){
      hideBooting();
      if(!b.ok) return;
      S.anim=true; applyBoard(b); saveSnap(); startPolling();
    });
  });
}

function doSignup(){

  if(pin!==pin2){ msg.textContent='두 번 입력한 PIN이 다릅니다.'; return; }
  if(/^(\d)\1{3}$/.test(pin) || pin==='1234' || pin==='0000'){
    msg.textContent='너무 쉬운 번호입니다. 다른 번호로 정해주세요.'; return;
  }

  if(btn.disabled) return;
  btn.disabled=true; msg.textContent='신청 중입니다...';

/* ===================== 갱신 ===================== */
function startPolling(){
  if(S.timer) clearInterval(S.timer);
  /* 왕복 한 번에 고정으로 1초 넘게 든다. 확인 자체가 비용이므로 자주 묻지 않는다.
     - 화면을 안 보고 있으면 묻지 않는다
     - 창(모달)을 열어 뭔가 하는 중이면 묻지 않는다 (그 왕복 뒤로 사용자 동작이 밀린다)
     - 방금 스스로 갱신했으면 건너뛴다 */
  S.timer = setInterval(function(){
    if(document.hidden) return;
    if($('modal') && $('modal').innerHTML) return;
    if(SOFT) return;
    if(Date.now() - (S.lastSync||0) < 50000) return;
    S.lastSync=Date.now(); S.lastCheck=Date.now();
    call('api_lastUpdate').then(function(v){
      if(v && v !== S.lastUpdate){ refresh(false); }
    });
  }, 60000);
  /* 앱으로 돌아올 때도 바뀐 게 있을 때만 받아온다 (무조건 board 를 받지 않는다).
     ★ 휴대폰에서는 앱을 자주 왔다갔다 하므로 20초 안에는 다시 묻지 않는다 (v43).
       확인 자체가 왕복 한 번이고, 그 왕복이 0.5~1초다. */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    if(Date.now() - (S.lastCheck||0) < 20000) return;
    S.lastCheck=Date.now();
    call('api_lastUpdate').then(function(v){
      if(v && v !== S.lastUpdate) refresh(false);
    });
  });
}

/** 저장 결과를 서버 응답 전에 화면에 먼저 반영 */
function applyTaskLocal(p){
  if(!S.data) return;
  var typeName='', corpName='';
  (S.meta.typeAll||S.meta.types||[]).forEach(function(t){ if(t.code===p.type) typeName=t.name; });
  (S.meta.corps||[]).forEach(function(c){ if(c.code===p.corp) corpName=c.name; });
  var ownerName=S.me.name;
  S.data.tasks.forEach(function(t){ if(t.owner===p.owner) ownerName=t.ownerName||ownerName; });

  var found=null;
  S.data.tasks.forEach(function(t){ if(p.id && t.id===p.id) found=t; });
  var d=new Date();
  var obj = found || { id:'(저장중)', flags:[], manpower:{g:0,j:0}, waste:0, progress:0,
                       lastLog:'', next:'', status:'대기', start:'', site:'', area:'',
                       scope:'', addr:'', tel:'', amount:0,
                       at: todayStr()+' '+p2(d.getHours())+':'+p2(d.getMinutes()) };
  obj.type=p.type; obj.typeName=typeName; obj.corp=p.corp; obj.corpName=corpName;
  obj.title=p.title; obj.content=p.content||''; obj.owner=p.owner; obj.ownerName=ownerName;
  obj.due=p.due; obj.co=p.co;
  // 창에서 넘어온 것만 바꾼다 (안 받는 칸은 예전 값을 그대로 둔다)
  if(p.site!==undefined) obj.site=p.site;
  if(p.amount!==undefined) obj.amount=Number(p.amount||0);
  if(!found) S.data.tasks.push(obj);
  renderBoard();
  if(S.view==='me') renderMe();
}

function applyLogLocal(p){
  if(!S.data) return;
  S.data.tasks.forEach(function(t){
    if(t.id!==p.taskId) return;
    if(p.progress!=null && p.progress!==''){
      var pg=Number(p.progress);
      t.progress=pg;
      if(pg>=100){ t.status='완료'; t.done=p.date; }
      else if(pg>0){ t.status='진행중'; t.done=''; }
    }
    t.lastLog=(p.date||'')+' '+String(p.text||'').split('\n')[0];
    t.next=p.next||'';
    if(p.g||p.j) t.manpower={g:Number(p.g||0), j:Number(p.j||0)};
    if(p.wton) t.waste=Math.round((Number(t.waste||0)+Number(p.wton))*10)/10;
  });
  renderBoard();
  if(S.view==='me') renderMe();
}

/* ===================== 분야별 번호표 (v43) =====================
   예전에는 '내가 들고 있는 게 아직 쓸 만한가' 를 `lastUpdate` 로 판단했다.
   그런데 그 값은 **누가 무엇을 저장하든** 바뀐다. 남이 업무 하나만 저장해도
   결재 문서 캐시와 게시글 캐시가 통째로 버려져서, 문서를 누를 때마다
   왕복 1회가 되살아났다 (v35에서 없앤 그 왕복이다).
   이제 결재는 결재 시트가, 게시글은 게시글·댓글이 바뀔 때만 버린다. */
function areaVer(k){
  return (S.data && S.data.vers && S.data.vers[k]) || '';
}

function takeDocPack(b){
  if(!b || !b.docPack) return;
  var at=(b.vers && b.vers.doc) || '';   // 결재 쪽 번호표로 맞춘다
  Object.keys(b.docPack).forEach(function(no){
    S.docCache[no]=b.docPack[no];
    S.docCacheAt[no]=at;
  });
}

function applyBoard(b){
  if(!b || !b.ok) return false;
  S.data=b; S.me=b.me;
  S.lastUpdate=b.lastUpdate||S.lastUpdate; S.lastSync=Date.now(); if(b.t) S.lastT=b.t;
  takeDocPack(b);
  renderBoard();
  renderNotices();
  $('atTime').textContent=b.at;
  navCount();
  showNoti(b.noti);
  if(S.view==='doc') renderDocs();     // 결재 목록도 같이 왔으니 바로 갈아끼운다
  saveSnap();
  return true;
}

 * 저장 API 는 board 를 만들지 않으므로(시트 11회 읽기가 사라짐)

var SOFT=null;
function softRefresh(){

    SOFT=null;
    call('api_board', S.token, S.corp).then(function(r){
      if(!r || !r.ok) return;
      S.data=r; S.me=r.me;
      S.lastUpdate=r.lastUpdate||''; S.lastSync=Date.now(); if(r.t) S.lastT=r.t;
      takeDocPack(r);
      renderBoard(); renderNotices();
      $('atTime').textContent=r.at;
      navCount(); showNoti(r.noti);
      if(S.view==='doc') renderDocs();
      if(S.view==='me') renderMe();

}

/** 숫자가 바뀌면 짧게 굴려서 바뀐 걸 알아채게 한다 */
function countUp(el, to){
  if(!el) return;
  var from=Number(el.textContent||0);
  if(from===to){ el.textContent=to; return; }
  var steps=Math.min(Math.abs(to-from),8);
  if(steps<=1){ el.textContent=to; bump(el); return; }
  var i=0, dir=(to>from)?1:-1, step=Math.ceil(Math.abs(to-from)/steps);
  var timer=setInterval(function(){
    i++;
    var v=from+dir*step*i;
    if((dir>0&&v>=to)||(dir<0&&v<=to)||i>=steps){ v=to; clearInterval(timer); bump(el); }
    el.textContent=v;
  }, 40);
}
function bump(el){
  el.style.transition='none';
  el.style.transform='scale(1.5)';
  requestAnimationFrame(function(){
    el.style.transition='transform .34s cubic-bezier(.16,.9,.28,1)';
    el.style.transform='none';
  });
}

/** 완료 전체보기 — board 가 이미 최근 30일치를 들고 있으므로 왕복 0회로 즉시 그린다 */
function openDoneAll(){
  var rows=(S.data? S.data.tasks:[]).filter(function(t){
    return t.status==='완료' && (S.corp==='ALL' || t.corp===S.corp);
  }).map(function(t){
    return { id:t.id, title:t.title, done:t.done, amount:t.amount,
             owner:t.ownerName, type:t.typeName, site:t.site };
  }).sort(function(a,b){ return (a.done||'')<(b.done||'')?1:-1; });

  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">완료된 업무</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    '<div id="daBody">'+doneBody(rows, monthsOf(rows), true)+'</div></div></div>';
}

/** 30일보다 오래된 것까지 — 눌렀을 때만 서버를 부른다 */
function loadDoneOld(){
  var btn=$('daOld');
  if(btn){ btn.disabled=true; btn.textContent='불러오는 중...'; }
  call('api_doneAll', S.token, S.corp).then(function(r){
    if(!$('daBody')) return;
    if(!r.ok){ if(btn){ btn.disabled=false; btn.textContent='더 오래된 것까지 보기'; } toast(r.msg||'불러오지 못했습니다'); return; }
    $('daBody').innerHTML=doneBody(r.rows||[], r.months||[], false);
  });
}

function monthsOf(rows){
  var by={};
  rows.forEach(function(t){
    var m=(t.done||'').substring(0,7)||'기타';
    if(!by[m]) by[m]={month:m,count:0,amount:0};
    by[m].count++; by[m].amount+=Number(t.amount||0);
  });
  return Object.keys(by).sort().reverse().map(function(k){ return by[k]; });
}

function doneBody(rows, months, partial){
  if(!rows.length){
    return empty('완료된 업무가 없습니다')+
      (partial? '<div class="actions"><button class="btn sm" id="daOld" onclick="loadDoneOld()">더 오래된 것까지 보기</button></div>':'');
  }
  var h='';
  if(months.length){
    h+='<div class="sumbox" style="margin-bottom:14px">';
    months.slice(0,6).forEach(function(m){
      h+='<p><b>'+esc(m.month)+'</b> · '+m.count+'건 · '+won(m.amount)+'원</p>';
    });
    h+='</div>';
  }
  var last='';
  rows.forEach(function(t){
    var m=(t.done||'').substring(0,7);
    if(m!==last){ h+=sechead(m||'날짜 없음'); last=m; }
    h+='<div class="lrow" onclick="closeOk();openTask(\''+t.id+'\')">'+
       '<div class="m"><p class="t">'+esc(t.title)+'</p>'+
       '<p class="b">'+
       esc([t.owner, shortDate(t.done), t.type, t.site].filter(function(x){ return x; }).join(' · '))+
       '</p></div>'+
       (t.amount? '<div class="r"><span class="v">'+won(t.amount)+'원</span></div>':'')+
       '</div>';
  });
  if(partial){
    h+='<div class="actions" style="margin-top:14px">'+
       '<button class="btn sm" id="daOld" onclick="loadDoneOld()">더 오래된 것까지 보기</button></div>';
  }
  return h;

function sumBox(A){

    '<p>완료 '+(s.count||0)+'건</p><p>'+won(s.amount||0)+'원</p></div>';

function lv(t){ 
  var d=t.flags.some(function(f){return f.lv==='danger'});
  var w=t.flags.some(function(f){return f.lv==='warn'});
  return d?'dg':(w?'wn':'');
}

function anim_(i){
  return i>=0 ? ' in" style="animation-delay:'+Math.min(i*80,640)+'ms' : '';
}

function cardSlim(t, i){
  var f=t.flags[0];
  // 빈 값이면 그 줄 자체를 만들지 않는다 (v42)
  var when=[];
  if(t.status==='완료'){
    if(t.done) when.push(shortDate(t.done));
    if(t.amount) when.push(won(t.amount)+'원');
  } else {
    if(t.start) when.push(shortDate(t.start)+' 시작');
    if(t.due) when.push('마감 '+shortDate(t.due));
  }
  return '<div data-tid="'+t.id+'" class="card '+lv(t)+(t.status==='완료'?' done':'')+anim_(i)+'" onclick="openTask(\''+t.id+'\')">'+
    '<p class="cn tt">'+esc(t.title)+(hasNewComment(t.id)?'<span class="cdot"></span>':'')+'</p>'+
    (f? '<p style="margin:4px 0 0;font-size:var(--fs-sm);color:var(--'+(f.lv==='danger'?'dg':'wn')+')">'+esc(f.t)+'</p>'
      : (when.length? '<p style="margin:4px 0 0;font-size:var(--fs-sm)" class="sub">'+esc(when.join(' · '))+'</p>' : ''))+
    '<p style="margin:3px 0 0;font-size:var(--fs-sm)" class="muted">'+
      esc([t.typeName, t.ownerName].filter(function(x){ return x; }).join(' · '))+'</p>'+
  '</div>';
}

function cardFull(t, i){
  var h='<div data-tid="'+t.id+'" class="card '+lv(t)+anim_(i)+'" onclick="openTask(\''+t.id+'\')">'+
    '<div class="ct"><p class="cn tt">'+esc(t.title)+
    (hasNewComment(t.id)?'<span class="cdot"></span>':'')+'</p>'+
    '<span class="meta">'+esc(t.typeName)+' · '+esc(t.corpName)+
    (t.site?' · '+esc(t.site):'')+'</span></div>';

  if(t.type==='DEMO' || t.progress>0){
    h+='<div style="display:flex;align-items:center;gap:7px;margin-top:6px">'+
       '<div class="bar"><i style="width:'+(t.progress||0)+'%"></i></div>'+
       '<span class="pct" style="white-space:nowrap">'+(t.progress||0)+'%'+
       (t.due?'<span class="sub" style="font-weight:400"> · '+dday(t.due)+'</span>':'')+'</span></div>';
  } else if(t.due){
    h+='<p style="margin:5px 0 0;font-size:var(--fs-sm)" class="sub">'+dday(t.due)+'</p>';
  }

  // 빈 값은 칸을 아예 만들지 않는다 (v42). 예전에는 하이픈만 남았다
  var cells = (t.type==='DEMO')
    ? kv('오늘 투입', (t.manpower.g||t.manpower.j)? ('기공'+t.manpower.g+' 조공'+t.manpower.j) : '')+
      kv('폐기물', t.waste? t.waste+'t' : '')+
      kv('계약', t.amount? won(t.amount) : '')+
      kv('담당', t.ownerName)
    : kv('담당', t.ownerName)+ kv('마감', t.due? shortDate(t.due) : '')+
      kv('상태', t.status||'대기')+ kv('법인', t.corpName);
  if(cells) h+='<div class="stats">'+cells+'</div>';

  if(t.lastLog){
    var sp=String(t.lastLog).indexOf(' ');
    var dt=sp>0? shortDate(t.lastLog.substring(0,sp)) : '';
    var tx=sp>0? t.lastLog.substring(sp+1) : t.lastLog;
    h+='<p class="lastline">'+(dt? '<span class="dt">'+esc(dt)+'</span>':'')+esc(tx)+'</p>';
  }

  if(t.flags.length || t.next){
    h+='<div class="flags">';
    t.flags.forEach(function(f){ h+='<span class="tag '+(f.lv==='danger'?'dg':'wn')+'">'+esc(f.t)+'</span>'; });
    if(t.next) h+='<span class="tag gy">다음: '+esc(t.next)+'</span>';
    h+='</div>';
  }
  return h+'</div>';
}
/** 값이 없으면 칸 자체를 만들지 않는다 (하이픈·'없음' 을 남기지 않는다) */
function kv(k,v){
  if(v===null||v===undefined||v===''||v==='-') return '';
  return '<div><p class="k">'+k+'</p><p class="num">'+esc(v)+'</p></div>';
}
function dday(due){
  var d=Math.round((new Date(due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
  if(d===0) return 'D-0';
  return d>0? ('D-'+d) : ('D+'+(-d));
}

/** 워크보드가 이미 들고 있는 재료로 상세 화면을 만든다 (서버 왕복 0회) */
function detailFromBoard(id, t){
  var d=S.data||{};
  var s=(d.settle && d.settle[id]) || null;      // 철거가 아니면 서버가 아예 안 보낸다
  return {
    ok:true, task:t,
