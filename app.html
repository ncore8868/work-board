    total:(d.logCount && d.logCount[id]) || 0,
    docs:(d.docsByTask && d.docsByTask[id]) || [],
    comments:(d.commentsByTask && d.commentsByTask[id]) || [],
    cmtTotal:(d.commentCount && d.commentCount[id]) || 0,
    settle: s? { rows:s.rows||[], sum:s } : null
  };
}

function openTask(id, keepFold){
  if(!keepFold) FOLD={};         // 창을 새로 열면 접힘 상태를 처음으로
  // 창 열기는 서버에 가지 않는다. 이미 받아둔 데이터로 바로 그린다.
  var t=null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===id) t=x; });

  if(t){
    var hadDot = hasNewComment(id);      // 점을 지우기 전에 기억해둔다
    var r = S.taskCache[id] || detailFromBoard(id, t);
    $('modal').innerHTML = taskSheetHtml(t, r);
    markCommentsSeen(id);
    paintReaders(id);
    sendRead(id, hadDot);        // 뒤에서 조용히. 창은 기다리지 않는다
    return;
  }

  // 진행판에 없는 업무(오래된 완료 건 등)일 때만 서버에 묻는다
  call('api_taskDetail', S.token, id).then(function(r){
    if(!r.ok){ toast(r.msg); return; }
    S.taskCache[id]=r;
    if(r.readers) S.readers[id]=r.readers;
    $('modal').innerHTML = taskSheetHtml(r.task, r);
    markCommentsSeen(id);
    paintReaders(id);
    sendRead(id, true);
  });
}

/* ---- 읽음 표시 ---- */

/**
 * 읽음 기록은 뒤에서 조용히 보낸다.
 * 접속 중 같은 업무를 또 열면 다시 보내지 않는다.
 * 단 **새 댓글이 있었으면 다시 보낸다** — 댓글을 어디까지 봤는지 갱신해야 하기 때문 (v44).
 */
function sendRead(id, force){
  if(S.readSent[id] && !force) return;
  S.readSent[id]=1;
  call('api_markRead', S.token, '업무', id).then(function(r){
    if(!r || !r.ok) return;
    S.readers[id]=r.readers||[];
    paintReaders(id);
  });
}

function paintReaders(id){
  var box=$('tdRead'); if(!box) return;
  var names=S.readers[id]||[];
  box.innerHTML = names.length
    ? '<p class="muted" style="margin:16px 0 0;font-size:var(--fs-sm)">읽음: '+esc(names.join(', '))+'</p>'
    : '';
}

/* ---- 안 읽은 댓글 점 ---- */

/**
 * 남이 쓴 댓글 중 아직 안 본 것이 있는가.
 *
 * ★ 판정은 서버가 한다 (v44). 화면은 서버가 준 값만 그린다.
 *   예전에는 화면 변수(S.seen)로 스스로 판단해서, 새로고침하면 이미 본 댓글에
 *   점이 되살아나고 다른 기기에서는 결과가 달랐다.
 *   지금은 '읽음' 시트에 사람별·업무별 마지막으로 본 시각이 남는다.
 */
function hasNewComment(id){
  var d=S.data||{};
  return !!(d.cmtDot && d.cmtDot[id]);
}

/** 상세를 열면 그 자리에서 점을 끈다 (낙관 처리). 서버 기록은 sendRead 가 뒤에서 남긴다 */
function markCommentsSeen(id){
  var d=S.data||{};
  if(!d.cmtDot || !d.cmtDot[id]) return;
  delete d.cmtDot[id];
  renderBoard();
  if(S.view==='me') renderMe();
  saveSnap();
}

/** '기록 더 보기' · '댓글 더 보기' 를 눌렀을 때만 전체를 받아온다 (왕복 1회) */
function loadTaskAll(id, btnId){
  var btn=btnId? $(btnId):null;
  if(btn){ btn.disabled=true; btn.textContent='불러오는 중...'; }
  call('api_taskDetail', S.token, id).then(function(r){
    if(!r.ok){ toast(r.msg); if(btn){ btn.disabled=false; } return; }
    S.taskCache[id]=r;
    if(r.readers) S.readers[id]=r.readers;
    if(!$('tdBody')) return;                 // 그새 창을 닫았으면 그만
    FOLD['log:'+id]=true;                    // 더 보기를 눌렀으니 펼친 채로 다시 그린다
    $('tdBody').innerHTML = taskDetailBody(r);
    paintReaders(id);
  });
}

/* ---- 화면이 가진 데이터를 직접 고친다 (board 를 기다리지 않는다) ---- */

/** 방금 쓴 기록을 상세·카드에 즉시 붙인다 */
function addLogLocal(taskId, log){
  if(!S.data || !log) return;
  if(!S.data.logsByTask) S.data.logsByTask={};
  if(!S.data.logCount) S.data.logCount={};
  var list=(S.data.logsByTask[taskId]||[]).slice();
  list.push(log);
  if(list.length>5) list=list.slice(list.length-5);
  S.data.logsByTask[taskId]=list;
  S.data.logCount[taskId]=(S.data.logCount[taskId]||0)+1;
  if(S.taskCache[taskId]) delete S.taskCache[taskId];
}

/** 지운 기록을 상세에서 즉시 뺀다 */
function dropLogLocal(taskId, logId){
  if(!S.data) return;
  if(S.data.logsByTask && S.data.logsByTask[taskId]){
    S.data.logsByTask[taskId]=S.data.logsByTask[taskId].filter(function(l){ return l.id!==logId; });
  }
  if(S.data.logCount && S.data.logCount[taskId]){
    S.data.logCount[taskId]=Math.max(0, S.data.logCount[taskId]-1);
  }
  delete S.taskCache[taskId];
}

/** 방금 쓴 댓글을 board 데이터에도 붙인다 (다시 열어도 보이게) */
function addCommentLocal(taskId, c){
  if(!S.data || !c) return;
  if(!S.data.commentsByTask) S.data.commentsByTask={};
  if(!S.data.commentCount) S.data.commentCount={};
  var list=(S.data.commentsByTask[taskId]||[]).slice();
  list.push(c);
  if(list.length>3) list=list.slice(list.length-3);
  S.data.commentsByTask[taskId]=list;
  S.data.commentCount[taskId]=(S.data.commentCount[taskId]||0)+1;
  S.seen['C'+taskId]=c.at;                 // 내가 쓴 것이니 점을 켜지 않는다
  if(S.taskCache[taskId]) delete S.taskCache[taskId];
}

/** 서버가 돌려준 정산 합계·줄을 board 데이터에 바로 반영 */
function applySettleRows(taskId, sum, rows){
  if(!S.data || !sum) return;
  if(!S.data.settle) S.data.settle={};
  sum.rows=rows||[];
  if(sum.claim==null) sum.claim=sum.total;
  S.data.settle[taskId]=sum;
  S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=sum.supply; });
  renderBoard();
}

/** 지운 공지를 상단 줄에서 즉시 뺀다 */
function dropNoticeLocal(no){
  if(!S.data) return;
  S.data.notices=(S.data.notices||[]).filter(function(n){ return n.no!==no; });
  renderNotices();
}

/** 지운 결재문서를 목록에서 즉시 뺀다 */
function dropDocLocal(no){
  if(!S.data || !S.data.docs) return;
  var d=S.data.docs;
  ['toAct','drafts','others'].forEach(function(k){
    d[k]=(d[k]||[]).filter(function(x){ return x.no!==no; });
  });
  S.data.approvals=(S.data.approvals||[]).filter(function(a){ return a.no!==no; });
  delete S.docCache[no]; delete S.docCacheAt[no];
  navCount();
  if(S.view==='doc') renderDocs();
}

/** 업무 상세의 정산 블록 — 서버가 settle 을 보낸 업무(철거)에서만 부른다 */
function settleHtml(r, t){
  var st=r.settle; if(!st || !st.sum) return '';
  var m=st.sum, rows=st.rows||[];
  if(m.total==null) m.total=m.claim||0;      // board 가 보낸 요약에도 대비
  var canPay=S.me && S.me.grade>=3;
  var isOwner=S.me && (S.me.grade>=3 || (t && t.owner===S.me.phone));
  var canDel=S.me && S.me.grade>=9;
  var tid=(t&&t.id)||r.task.id;

  var h='<div class="settle">'+
    '<div class="top"><span class="sub">계약금액 <span class="muted">(공급가)</span></span>'+
      '<span class="big">'+won(m.supply)+'원</span></div>'+
    (m.supply? '<p class="muted" style="margin:-4px 0 8px;font-size:var(--fs-sm);text-align:right">'+
      wonKo(m.supply)+' · 부가세 포함 '+won(m.total)+'원</p>' : '')+
    '<div class="grid">'+
      '<div><p class="k">최초견적</p><p class="num">'+won(m.base)+'</p></div>'+
      // 돈 칸은 넉 줄이 나란히 서야 읽히므로 칸을 없애지 않고, 하이픈 대신 0 을 쓴다
      '<div><p class="k">추가</p><p class="num" style="color:'+(m.add?'var(--wn)':'')+'">'+
        (m.add? '+'+won(m.add):'0')+'</p></div>'+
      '<div><p class="k">차감</p><p class="num">'+(m.minus? '-'+won(m.minus):'0')+'</p></div>'+
      '<div><p class="k">미수금</p><p class="num" style="color:'+(m.unpaid>0?'var(--dg)':'var(--ok)')+'">'+
        (m.total? won(m.unpaid):'0')+'</p></div>'+
    '</div>';

  if(m.total){
    h+='<div class="paybar"><i style="width:'+Math.min(m.rate,100)+'%"></i></div>'+
       '<p class="sub" style="margin:0;font-size:var(--fs-sm)">입금 '+won(m.paid)+'원 / '+won(m.total)+'원'+
       ' ('+m.rate+'%)'+(m.taxCount? ' · 세금계산서 '+m.taxCount+'건 발행':'')+'</p>';
  }
  h+='</div>';

  if(rows.length){
    h+='<h4 class="sech">정산 내역</h4>';
    rows.forEach(function(x){
      var cls = x.kind==='입금'?'pay':(x.kind==='추가'?'add':'');
      h+='<div class="slrow"><div style="flex:1;min-width:0">'+
         '<span class="tagk '+cls+'">'+esc(x.kind)+'</span> '+esc(x.memo||'')+
         '<div class="muted" style="font-size:var(--fs-sm)">'+
         esc([shortDate(x.date), x.docNo, x.tax].filter(function(y){ return y; }).join(' · '))+
         '</div></div>'+
         '<div style="text-align:right;white-space:nowrap">'+
         '<span class="num">'+(x.kind==='차감'?'-':'')+won(x.amount)+'</span>'+
         (canDel? ' <button class="del" style="border:none;background:transparent;color:var(--t3);cursor:pointer;font-size:var(--fs-num-sm)" onclick="delSettle(\''+x.id+'\',\''+tid+'\')">×</button>':'')+
         '</div></div>';
    });
  }

  h+='<div class="actions" style="margin:12px 0 4px">';
  if(isOwner) h+='<button class="btn sm" onclick="openAddWork(\''+tid+'\')">추가공사 요청</button>';
  if(isOwner) h+='<button class="btn sm" onclick="openSettleForm(\''+tid+'\',\'차감\')">차감 등록</button>';
  if(canPay)  h+='<button class="btn sm pri" onclick="openSettleForm(\''+tid+'\',\'입금\')">입금 등록</button>';
  h+='</div>';

  return h;
}

/**
 * 업무 상세 (v42에서 다시 짬).
 *
 * 중요도와 보이는 크기를 맞춘다. 위에서부터
 *   1) 업무명            가장 크고 굵게
 *   2) 누가 언제 · 상태 · 마감   작고 어둡게 한 줄
 *   3) 내용              본문 크기
 *   4) 버튼 3개
 *   5) 마지막 기록 → 이전 기록 → 정산 → 댓글
 *   6) 읽음
 *
 * 예전에는 상태·담당·기간·작성을 라벨 붙여 네 줄로 늘어놓았고,
 * 값이 없어도 '기간  - ~ 2026-08-28' 처럼 하이픈이 남았다. 빈 값은 이제 줄을 만들지 않는다.
 */
function taskSheetHtml(t, r){
  var demo=(t.type==='DEMO');

  // 2) 누가 언제 — 이름과 날짜가 제목 바로 아래 오게 한다
  var head=[];
  if(t.ownerName) head.push(t.ownerName);
  if(t.at) head.push(shortDate(t.at));
  head.push(t.status+(t.progress? ' '+t.progress+'%' : ''));
  if(t.start && t.due) head.push({ t:shortDate(t.start)+'~'+shortDate(t.due),
                                   hot:(t.status!=='완료' && isPast(t.due)) });
  else if(t.due)       head.push({ t:'마감 '+shortDate(t.due),
                                   hot:(t.status!=='완료' && isPast(t.due)) });
  else if(t.start)     head.push('시작 '+shortDate(t.start));
  if(t.status==='완료' && t.done) head.push('완료 '+shortDate(t.done));

  // 철거 업무의 현장 정보도 라벨 없이 한 줄로 (있는 것만)
  var site=[];
  if(demo){
    if(t.site) site.push(t.site);
    if(t.addr) site.push(t.addr);
    if(t.area) site.push(t.area+'평');
    if(t.scope) site.push(t.scope);
    if(t.tel) site.push(t.tel);
    if(t.amount) site.push('계약 '+won(t.amount)+'원');
  }

  return '<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(t.title)+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    byline(head)+
    (site.length? byline(site) : '')+
    (t.content? '<div style="margin:0 0 18px">'+fmt(t.content)+'</div>' : '')+
    '<div class="actions" style="margin-bottom:22px">'+
      '<button class="btn pri" onclick="openLogForm(\''+t.id+'\')">기록 남기기</button>'+
      '<button class="btn" onclick="openTaskForm(\''+t.id+'\')">수정</button>'+
      '<button class="btn dg" onclick="deleteTask(\''+t.id+'\',\''+esc(t.title).replace(/'/g,'')+'\')">삭제</button>'+
    '</div>'+
    '<div id="tdBody">'+ (r? taskDetailBody(r) : '<p class="muted" style="font-size:var(--fs-sm)">불러오는 중...</p>') +'</div>'+
    '</div></div>';
}

/** 확인창을 이미 눌렀으니 더 기다리게 하지 않는다. 실패하면 되돌린다 */
function deleteLogFromTask(logId, taskId){
  if(!confirm('이 기록을 삭제할까요?')) return;
  var back=S.data? JSON.parse(JSON.stringify({
    logs:(S.data.logsByTask||{})[taskId]||null,
    cnt:(S.data.logCount||{})[taskId]||0 })) : null;

  dropLogLocal(taskId, logId);
  toast('삭제되었습니다');
  closeOk();
  FOLD={}; FOLD['log:'+taskId]=1;      // 보고 있던 기록 구역은 펼친 채로
  openTask(taskId, true);              // 다시 여는 것도 왕복 0회

  call('api_deleteLog', S.token, logId, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data){
        if(back.logs) S.data.logsByTask[taskId]=back.logs;
        S.data.logCount[taskId]=back.cnt;
        delete S.taskCache[taskId];
        renderBoard();
      }
      toast('삭제하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/** 진행 기록 한 건 */
function logEv(l, taskId){
  var mine = (S.me && (S.me.grade>=9 || l.who===S.me.name));
  // '누가 언제' 순서로 통일한다 (v42). 예전에는 날짜가 먼저였다
  var head=[l.who, shortDate(l.date)];
  if(l.progress) head.push(l.progress+'%');
  var h='<div class="ev"><div class="d" style="display:flex;justify-content:space-between;gap:8px">'+
     '<span>'+esc(head.filter(function(x){ return x; }).join(' · '))+'</span>'+
     (mine && l.id ? '<button class="del" style="border:none;background:transparent;color:var(--t3);cursor:pointer;font-size:var(--fs-num-sm);line-height:1" title="기록 삭제" onclick="event.stopPropagation();deleteLogFromTask(\''+l.id+'\',\''+taskId+'\')">×</button>' : '')+
     '</div>'+
     '<div style="white-space:pre-wrap;line-height:1.7">'+esc(l.text)+'</div>';
  var extra=[];
  if(l.g||l.j) extra.push('기공'+l.g+' 조공'+l.j);
  if(l.wton) extra.push((l.wt||'폐기물')+' '+l.wton+'t');
  if(l.eq) extra.push(l.eq+(l.eqd?' '+l.eqd+'일':''));
  if(extra.length) h+='<div class="sub" style="margin-top:3px">'+esc(extra.join(' · '))+'</div>';
  if(l.extra) h+='<div style="margin-top:4px"><span class="tag wn">추가견적 필요</span></div>';
  // 빈 값에 괄호만 남기지 않는다 (v42)
  if(l.next){
    h+='<div class="muted" style="margin-top:3px">다음: '+esc(l.next)+
       (l.nextDate? ' ('+esc(shortDate(l.nextDate))+')' : '')+'</div>';
  }
  if(l.photo) h+='<div style="margin-top:4px"><a href="'+esc(l.photo)+'" target="_blank" class="sub">사진 보기</a></div>';
  return h+'</div>';
}

/**
 * 상세 본문.
 * 항상 보이는 것: 관련 결재(있을 때) · 마지막 기록 1건
 * 접히는 것: 이전 기록 · 정산(철거만) · 댓글 — 전부 이미 받아둔 데이터라 펼쳐도 왕복 0회
 */
function taskDetailBody(r){
  var t=r.task;
  var logs=r.logs||[];
  var total=(r.total!=null && r.total>logs.length)? r.total : logs.length;
  var h='';

  if(r.docs && r.docs.length){
    h+='<h4 class="sech">관련 결재</h4>';
    r.docs.forEach(function(d){
      h+='<div class="lrow" onclick="openDoc(\''+d.no+'\')">'+
         '<div class="m"><p class="t">'+esc(d.title)+'</p></div>'+
         '<div class="r">'+(d.amount? '<span class="v">'+won(d.amount)+'원</span>':'')+
         '<span class="s">'+docBadge(d.status)+'</span></div></div>';
    });
    h+='<div style="height:14px"></div>';
  }

  // 마지막 기록 1건은 접지 않는다
  h+='<h4 class="sech">마지막 기록</h4>';
  h+= logs.length ? ('<div class="tl">'+logEv(logs[0], t.id)+'</div>')
                  : empty('아직 기록이 없습니다');

  // 접기 1 — 이전 기록 (마지막 1건은 위에 이미 보이므로 나머지만)
  var restCount=total-1;
  if(restCount>0){
    var body='';
    var rest=logs.slice(1);
    if(rest.length) body+='<div class="tl">'+rest.map(function(l){ return logEv(l, t.id); }).join('')+'</div>';
    if(total>logs.length){
      body+='<div class="actions" style="margin:8px 0 2px">'+
        '<button class="btn sm" id="tdMore" onclick="loadTaskAll(\''+t.id+'\',\'tdMore\')">'+
        '기록 더 보기 ('+(total-logs.length)+'건)</button></div>';
    }
    h+=foldBox('log:'+t.id, '이전 기록 '+restCount+'건', body);
  }

  // 접기 2 — 정산 (서버가 settle 을 보낸 업무 = 철거에만 있다)
  if(r.settle && r.settle.sum){
    h+=foldBox('settle:'+t.id,
      '정산 · 공급가 '+won(r.settle.sum.supply)+'원', settleHtml(r, t));
  }

  // 댓글은 접지 않는다. 항상 목록과 입력칸이 보인다
  var cl=r.comments||[];
  var ct=(r.cmtTotal!=null && r.cmtTotal>cl.length)? r.cmtTotal : cl.length;
  h+='<div style="border-top:1px solid var(--line);padding-top:14px;margin-top:4px">'+
     commentsHtml('업무', t.id, cl, ct, true)+'</div>';

  h+='<div id="tdRead"></div>';
  return h;
}

function row(k,v){ return '<div class="k">'+k+'</div><div>'+esc(v)+'</div>'; }

function deleteLog(logId){

function saveSettle(taskId, kind){
  var amt=moneyVal($('stAmt'));
  var msg=$('stMsg');
  if(!amt){ msg.textContent='금액을 입력해주세요.'; return; }
  var memo=$('stMemo').value.trim();
  if(kind==='입금'){
    var k=pickedVal('stKind');
    memo = (k?k:'') + (memo? ' · '+memo : '');
  } else if(!memo){ msg.textContent='사유를 입력해주세요.'; return; }

  var btn=$('stSave'); if(btn.disabled) return;
  btn.disabled=true;
  var date=$('stDate').value;
  var tax=(kind==='입금'? pickedVal('stTax') : '');
  var send={ taskId:taskId, kind:kind, amount:amt, memo:memo, date:date, tax:tax };

  /* 차감은 낙관 처리 — 즉시 반영하고 창을 닫는다.
     입금은 돈이 걸린 것이라 서버 확인 후에 닫는다. */
  if(kind==='차감'){
    var backup=applySettleLocal(taskId, { id:'', kind:'차감', amount:amt, memo:memo,
                                          date:date||todayStr(), docNo:'', tax:'' });
    closeOk(); toast('차감이 등록되었습니다');
    FOLD={}; FOLD['settle:'+taskId]=1;
    openTask(taskId, true);

    call('api_addSettle', S.token, send, S.corp).then(function(r){
      if(!r.ok){
        if(backup && S.data && S.data.settle) S.data.settle[taskId]=backup;
        renderBoard();
        toast('차감 저장 실패: '+r.msg);
        FOLD={}; FOLD['settle:'+taskId]=1;
        openTask(taskId, true);
        return;
      }
      delete S.taskCache[taskId];
      applySettleRows(taskId, r.sum, r.rows);
      softRefresh();
      FOLD={}; FOLD['settle:'+taskId]=1;
      openTask(taskId, true);
    });
    return;
  }

  msg.textContent='등록 중입니다...';
  call('api_addSettle', S.token, send, S.corp).then(function(r){
    btn.disabled=false;
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk(); toast(kind+'이 등록되었습니다');
    delete S.taskCache[taskId];
    applySettleRows(taskId, r.sum, r.rows);
    softRefresh();
    FOLD={}; FOLD['settle:'+taskId]=1;   // 정산 구역은 펼친 채로 다시 연다
    openTask(taskId, true);
  });
}

/** 정산 줄 하나를 화면에 먼저 더한다. 되돌릴 수 있게 원래 값을 돌려준다 */
function applySettleLocal(taskId, row){
  if(!S.data || !S.data.settle || !S.data.settle[taskId]) return null;
  var backup=JSON.parse(JSON.stringify(S.data.settle[taskId]));
  var s=S.data.settle[taskId];
  s.rows=(s.rows||[]).concat([row]);
  recalcSettle(s);
  S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=s.supply; });
  return backup;
}

/** 서버 계산식(최초견적 + 추가 - 차감 = 공급가)을 화면에서 잠깐 흉내낸다.
    1초 뒤 서버 응답이 오면 그 값으로 갈아끼워진다 */
function recalcSettle(s){
  var base=0, add=0, minus=0, paid=0, payCnt=0, taxCnt=0;
  (s.rows||[]).forEach(function(r){
    if(r.kind==='최초견적') base+=r.amount;
    else if(r.kind==='추가') add+=r.amount;
    else if(r.kind==='차감') minus+=Math.abs(r.amount);
    else if(r.kind==='입금'){ paid+=r.amount; payCnt++;
      if(String(r.tax||'').indexOf('발행')>=0) taxCnt++; }
  });
  s.base=base; s.add=add; s.minus=minus;
  s.supply=base+add-minus;
  s.vat=Math.round(s.supply*0.1);
  s.total=s.supply+s.vat; s.claim=s.total;
  s.paid=paid; s.unpaid=s.total-paid;
  s.payCount=payCnt; s.taxCount=taxCnt;
  s.rate=s.total>0? Math.round(paid/s.total*100) : 0;
}

function delSettle(settleId, taskId){
  if(!confirm('이 정산 항목을 삭제할까요?\n계약금액이 다시 계산됩니다.')) return;

  // 화면에서 먼저 빼고 합계를 다시 계산한다 (서버 계산식과 같은 식)
  var back=null;
  if(S.data && S.data.settle && S.data.settle[taskId]){
    back=JSON.parse(JSON.stringify(S.data.settle[taskId]));
    var s=S.data.settle[taskId];
    s.rows=(s.rows||[]).filter(function(x){ return x.id!==settleId; });
    recalcSettle(s);
    S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=s.supply; });
  }
  delete S.taskCache[taskId];
  toast('삭제되었습니다');
  FOLD={}; FOLD['settle:'+taskId]=1;
  openTask(taskId, true);

  call('api_deleteSettle', S.token, settleId, taskId, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data && S.data.settle) S.data.settle[taskId]=back;
      toast('삭제하지 못했습니다: '+r.msg);
      FOLD={}; FOLD['settle:'+taskId]=1;
      openTask(taskId, true);
      return;
    }
    applySettleRows(taskId, r.sum, r.rows);
    softRefresh();
  });
}

function deleteTask(id, title){
  if(!confirm('"'+title+'" 업무를 삭제할까요?\n이 업무에 남긴 작업기록도 함께 지워지고, 되돌릴 수 없습니다.')) return;
  var backup = S.data ? JSON.parse(JSON.stringify(S.data.tasks)) : null;
  if(S.data){
    S.data.tasks = S.data.tasks.filter(function(t){ return t.id!==id; });
    renderBoard(); if(S.view==='me') renderMe();
  }
  closeOk(); toast('삭제되었습니다');

  call('api_deleteTask', S.token, id, S.corp).then(function(r){
    if(!r.ok){
      if(backup && S.data){ S.data.tasks=backup; renderBoard(); if(S.view==='me') renderMe(); }
      toast('삭제 실패: '+r.msg);
      return;
    }
    softRefresh();
  });
}
/* ===================== 창 닫기 보호 (v38) =====================
   공지를 길게 쓰다 바깥을 눌러 전부 날린 일이 있었다.
   · 어두운 배경을 눌러도, ESC 를 눌러도 닫히지 않는다
   · [닫기]·[취소] 는 손댄 칸이 하나라도 있으면 한 번 물어본다
   · 저장·상신이 끝나서 닫는 것(closeOk)은 묻지 않는다

   손댔는지 판정은 창이 열릴 때의 칸 값을 적어두고 닫을 때 견주는 방식이다.
   창마다 따로 표시할 필요가 없어서 새 창을 만들어도 저절로 보호된다. */
var MODAL_ROOT=null, MODAL_SIG=null, MODAL_TOUCHED=false, MODAL_DRAWN=false;

/** 지금 창 안 입력칸들의 상태를 글자 하나로 */
function modalSig(){
  var box=$('modal');
  if(!box || !box.innerHTML) return null;
  var s=[];
  // 서식 편집칸도 같이 본다 (v44). 안 그러면 공지를 길게 쓰다 [닫기] 를 눌러도 안 물어본다
  [].forEach.call(box.querySelectorAll('[contenteditable]'),function(e){
    s.push(String(e.textContent==null?'':e.textContent));
  });
  [].forEach.call(box.querySelectorAll('input,textarea,select'),function(e){
    if(e.type==='button' || e.type==='submit') return;
    s.push((e.type==='checkbox'||e.type==='radio') ? (e.checked?'1':'0') : String(e.value==null?'':e.value));
  });
  return s.join('\u0001');
}

/** 창이 새로 열렸으면 그때의 값을 기준으로 삼는다 */
function modalWatch(){
  var box=$('modal'); if(!box) return;
  var root=box.firstElementChild||null;
  if(root===MODAL_ROOT) return;
  MODAL_ROOT=root; MODAL_TOUCHED=false; MODAL_DRAWN=false;
  MODAL_SIG=modalSig();
  /* 창을 띄운 뒤에 프로그램이 칸을 채우는 곳이 있다 (추가공사 요청이 그렇다).
     사용자가 아직 아무것도 안 건드렸으면 그 값을 기준으로 다시 잡는다.
     그래야 손도 안 댄 창에서 [취소] 를 눌렀을 때 쓸데없이 묻지 않는다. */
  setTimeout(function(){
    if(box.firstElementChild===MODAL_ROOT && !MODAL_TOUCHED) MODAL_SIG=modalSig();
  }, 400);
}

/** 창 안에서 뭔가 건드렸는지 */
function modalDirty(){
  if(MODAL_DRAWN) return true;                        // 도장처럼 칸이 아닌 곳에 그린 경우
  if(MODAL_SIG===null || !MODAL_TOUCHED) return false;
  var now=modalSig();
  return now!==null && now!==MODAL_SIG;
}

/** 사용자가 [닫기]·[취소] 를 누른 경우 — 쓰던 게 있으면 물어본다 */
function closeModal(force){
  var box=$('modal'); if(!box) return;
  if(!force && box.innerHTML && modalDirty()){
    if(!confirm('작성 중인 내용이 사라집니다. 닫을까요?')) return;
  }
  box.innerHTML='';
  MODAL_ROOT=null; MODAL_SIG=null; MODAL_TOUCHED=false; MODAL_DRAWN=false;
}

/** 저장·상신·삭제가 끝나서 닫는 경우 — 묻지 않는다 */
function closeOk(){ closeModal(true); }

(function(){
  var box=$('modal');
  if(!box) return;

  // 창이 바뀌면 기준값을 다시 잡는다
  if(window.MutationObserver){
    new MutationObserver(function(){ modalWatch(); }).observe(box, { childList:true });
  }

  /* 사람이 실제로 건드렸을 때만 표시한다. 프로그램이 채워 넣는 값은 여기 안 걸린다.
     ＋－ 버튼처럼 눌러서 숫자가 바뀌는 칸도 클릭이 걸리므로 같이 잡힌다.
     아무것도 안 바꾸고 [취소] 만 눌렀다면 값이 그대로라 묻지 않는다. */
  ['input','change','click','keydown'].forEach(function(ev){
    box.addEventListener(ev, function(){ MODAL_TOUCHED=true; }, true);
  });
  ['pointerdown','mousedown','touchstart'].forEach(function(ev){
    box.addEventListener(ev, function(e){
      if(e.target && e.target.tagName==='CANVAS') MODAL_DRAWN=true;   // 도장을 그렸다
    }, true);
  });
  // ESC 로는 닫지 않는다 (쓰던 글이 날아가지 않게)
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape' && e.keyCode!==27) return;
    if(e.isComposing) return;              // 한글 입력 중의 ESC 는 글자 취소용이라 건드리지 않는다
    var b=$('modal');
    if(b && b.innerHTML){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();

/* ===================== 업무 등록/수정 ===================== */
function openTaskForm(id){
  if(!id){ drawTaskForm('', null); return; }
  // 화면이 이미 들고 있는 값으로 즉시 띄운다 (서버에 가지 않음)
  var t=null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===id) t=x; });
  if(t){ drawTaskForm(id, t); return; }
  // 진행판에 없는 업무(완료 오래된 건 등)일 때만 서버 조회
  call('api_taskDetail', S.token, id).then(function(r){
    if(!r.ok){ toast(r.msg); return; }
    drawTaskForm(id, r.task);
  });
}

function drawTaskForm(id, t){
  var types=(S.meta.types||[]).slice(), corps=S.meta.corps;
  /* 지금 고를 수 있는 유형만 버튼으로 만든다 (철거·영업·시스템·기타).
     ★ 단, 수정하려는 업무가 이미 '그만 쓰기로 한 유형'(총무)이면 그 버튼도 같이 만든다.
       안 그러면 저장할 때 유형이 엉뚱하게 바뀐다 (v44). */
  if(t && t.type && !types.some(function(x){ return x.code===t.type; })){
    var old=null;
    (S.meta.typeAll||[]).forEach(function(x){ if(x.code===t.type) old=x; });
    types.push(old || { code:t.type, name:t.typeName||t.type });
  }
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+(id?'업무 수정':'새 업무')+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    '<input type="hidden" id="tfId" value="'+(id||'')+'">'+
    '<input type="hidden" id="tfCo" value="'+esc(t&&t.co?t.co:'')+'">'+
    '<div class="field"><label class="fl req">업무 유형</label><div class="chks" id="tfType">'+
      types.map(function(x){ return '<label data-v="'+x.code+'" class="'+
        ((t&&t.type===x.code)||(!t&&x.code==='DEMO')?'on':'')+'" onclick="pickType(this)">'+esc(x.name)+'</label>'; }).join('')+
    '</div></div>'+
    '<div class="grid2">'+
      '<div class="field"><label class="fl req">법인</label><select id="tfCorp">'+
        corps.map(function(c){ return '<option value="'+c.code+'"'+(t&&t.corp===c.code?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="field"><label class="fl req">담당자</label><select id="tfOwner">'+staffOptions(t?t.owner:S.me.phone)+'</select></div>'+
    '</div>'+
    '<div class="field"><label class="fl req">업무명</label><input type="text" id="tfTitle" value="'+esc(t?t.title:'')+'"></div>'+
    '<div class="field"><label class="fl">내용</label>'+
      mkEditor('tfContent', (t&&t.content)?t.content:'', 86)+
      '</div>'+
    '<div class="field"><label class="fl">마감일</label>'+
      '<input type="date" id="tfDue" value="'+esc(t?t.due:'')+'"></div>'+
    '<div id="tfDemo">'+
      '<div class="grid2">'+
        '<div class="field"><label class="fl">현장</label>'+
          '<select id="tfSite" onchange="fillFromSite()">'+siteOptions(t?t.site:'')+'</select></div>'+
        '<div class="field"><label class="fl">계약금액(원)</label>'+
          '<input type="number" id="tfAmount" value="'+(t&&t.amount?t.amount:'')+'"></div>'+
      '</div>'+
    '</div>'+
    '<div class="actions"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="tfSave" onclick="saveTask()">저장</button></div>'+
    '<p class="muted" id="tfMsg" style="margin-top:8px"></p></div></div>';
  $('modal').innerHTML=h;
  syncDemo();
}
function staffOptions(sel){
  var list=(S.data&&S.data.attendance&&S.data.attendance.rows)||[];
  var opts='';
  (S.staffCache||[]).forEach(function(){});
  // 담당자 목록은 진행판 데이터에서 이름만 뽑되, 없으면 본인만
  var seen={};
  (S.data? S.data.tasks:[]).forEach(function(t){ if(t.owner&&!seen[t.owner]){ seen[t.owner]=t.ownerName; } });
  seen[S.me.phone]=S.me.name;
  for(var p in seen) opts+='<option value="'+p+'"'+(p===sel?' selected':'')+'>'+esc(seen[p])+'</option>';
  return opts;
}
/** 현장 드롭다운. 예전 데이터의 현장코드가 목록에 없으면 그것도 살려둔다 */
function siteOptions(sel){
  var list=(S.meta&&S.meta.sites)||[];
  var have=false;
  var h='<option value="">선택 안 함</option>';
  list.forEach(function(x){
    if(x.code===sel) have=true;
    h+='<option value="'+esc(x.code)+'"'+(x.code===sel?' selected':'')+'>'+
       esc(x.code)+(x.name?' · '+esc(x.name):'')+'</option>';
  });
  if(sel && !have) h+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return h;
}

/** 현장을 고르면 업무명이 비어 있을 때만 고객명을 채워준다 */
function fillFromSite(){
  var el=$('tfSite'); if(!el) return;
  var v=el.value;
  var hit=null;
  ((S.meta&&S.meta.sites)||[]).forEach(function(x){ if(x.code===v) hit=x; });
  if(!hit) return;
  if(hit.name && $('tfTitle') && !$('tfTitle').value) $('tfTitle').value=hit.name;
}

function pickType(el){ pickOne(el); syncDemo(); }
function pickOne(el){
  [].forEach.call(el.parentNode.children,function(c){ c.classList.remove('on'); });
  el.classList.add('on');
}
function pickedVal(id){
  var box=$(id); if(!box) return '';
  var on=box.querySelector('.on'); return on? (on.dataset.v||on.textContent) : '';
}
function syncDemo(){
  var t=pickedVal('tfType');
  $('tfDemo').classList.toggle('hide', t!=='DEMO');
}

function shrink(file){
  return new Promise(function(res){
    if(!file){ res(''); return; }
    loadImg(file).then(function(img){
      if(!img){ res(''); return; }
      res(drawJpeg(img, 900, 0.55).url);
    });
  });
}

/* ===================== 영수증 사진 (v42) =====================
   영수증은 글씨를 읽어야 하므로 사실상 원본 화질로 올린다.
   긴 변 2400px · 품질 0.92 가 기본이고, 원본이 더 작으면 크기를 건드리지 않는다.
   형식은 언제나 JPEG — 아이폰 HEIC 을 그대로 올리면 PC 에서 열리지 않는다.
   흑백 대비를 높이는 처리는 하지 않는다 (얇은 글씨가 지워질 위험만 있다).

   ★ 용량이 한도를 넘으면 사용자에게 묻지 않고 앱이 알아서 단계를 내린다.
     보내기 전에 크기를 재서, 넘을 것 같으면 **보내보지도 않고** 다음 단계로 간다.
     (base64 로 바뀌면 1.33배가 되므로 그 값으로 판단한다) */
var RECEIPT_STEPS=[
  {w:2400,q:0.92},{w:2400,q:0.85},{w:2400,q:0.75},
  {w:1800,q:0.85},{w:1800,q:0.75},
  {w:1200,q:0.75}
];
var RECEIPT_LIMIT=7*1024*1024;   // base64 로 보낼 수 있는 한도

function loadImg(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(e){
      var img=new Image();
      img.onload=function(){ res(img); };
      img.onerror=function(){ res(null); };
      img.src=e.target.result;
    };
    fr.onerror=function(){ res(null); };
    fr.readAsDataURL(file);
  });
}

/** 긴 변을 max 로 줄여 JPEG 로. 원본이 더 작으면 크기를 건드리지 않는다 */
function drawJpeg(img, max, q){
  var w=img.width, h=img.height;
  if(w>max||h>max){
    if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; }
  }
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d');
  g.fillStyle='#FFFFFF'; g.fillRect(0,0,w,h);   // 투명 배경이 검게 나오지 않게
  g.drawImage(img,0,0,w,h);
  return { url:c.toDataURL('image/jpeg',q), w:w, h:h };
}

/**
 * 영수증을 한도 안에 들어오는 가장 좋은 화질로 만든다.
 * 사용자는 실패를 겪지 않는다 — 마지막 단계까지 안 되면 그때만 빈 값을 돌려준다.
 */
function shrinkReceipt(file){
  return new Promise(function(res){
    if(!file){ res(''); return; }
    loadImg(file).then(function(img){
      if(!img){
        console.log('[영수증] 이미지를 읽지 못했습니다 (형식 문제일 수 있습니다)');
        res(''); return;
      }
      for(var i=0;i<RECEIPT_STEPS.length;i++){
        var s=RECEIPT_STEPS[i];
        var out=drawJpeg(img, s.w, s.q);
        var kb=Math.round(out.url.length/1024);
        if(out.url.length<=RECEIPT_LIMIT){
          console.log('[영수증] '+s.w+'px 품질 '+s.q+' · 실제 '+out.w+'×'+out.h+
                      ' · '+kb+'KB · '+(i? (i+1)+'번째 시도에서 성공':'첫 시도에서 성공'));
          res(out.url); return;
        }
        console.log('[영수증] '+s.w+'px 품질 '+s.q+' · '+kb+'KB — 한도('+
                    Math.round(RECEIPT_LIMIT/1024)+'KB)를 넘어 보내지 않고 다음 단계로');
      }
      console.log('[영수증] 마지막 단계까지 갔는데도 한도를 넘었습니다');
      res('');
    });
  });
}

/** 글 상세 — 캐시가 있으면 왕복 0회 */
function openPost(no){
  S.seen['N'+no]=1;
  renderNotices();

  // 캐시에 있으면 그걸로, 없으면 board 가 준 공지 3건(본문 포함)으로 즉시 연다
  var have = S.postCache && (S.postCache.posts||[]).some(function(x){ return x.no===no; });
  if(have){ drawPost(no); return; }

  var stub=noticeStub();
  var inStub=(stub.posts||[]).some(function(x){ return x.no===no; });
  if(inStub){
    drawPost(no, stub);                       // 왕복 0회
    if(S.postCache && S.postCacheAt===areaVer('post')) return;
    var at2=areaVer('post');
    call('api_posts', S.token).then(function(r){   // 댓글은 뒤에서 채운다
      if(!r.ok) return;
      S.postCache=r; S.postCacheAt=at2;
      if($('pcBody')) drawPost(no);
    });
    return;
  }

    '<p class="muted" style="font-size:var(--fs-sm);margin:0">불러오는 중...</p></div></div>';
  var at3=areaVer('post');
  call('api_posts', S.token).then(function(r){
    if(!r.ok){ toast(r.msg||'글을 열 수 없습니다'); closeOk(); return; }
    S.postCache=r; S.postCacheAt=at3;
    drawPost(no);
  });

    '<div id="pcBody">'+
      commentsHtml('게시글', p.no, (r.comments&&r.comments[p.no])||[], null, true)+
    '</div></div></div>';
  $('modal').innerHTML=h;
}

/** 공지 쓰기 / 수정 — 제목과 내용 두 칸뿐 */
function openPostForm(no){
  var p=null;
  var src=S.postCache||noticeStub();
  (src.posts||[]).forEach(function(x){ if(no && x.no===no) p=x; });

  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+(p?'공지 수정':'공지 쓰기')+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    // 안내문은 없앴다 (v44). 올리기를 누르면 확인 창에서 어차피 한 번 물어본다
    '<div class="field"><label class="fl req">제목</label>'+
      '<input type="text" id="pfTitle" value="'+esc(p?p.title:'')+'"></div>'+
    '<div class="field"><label class="fl req">내용</label>'+
      mkEditor('pfBody', p?p.body:'', 110)+'</div>'+
    '<div class="actions"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="pfSave" onclick="savePost(\''+(p?p.no:'')+'\')">'+
      (p?'수정':'올리기')+'</button></div>'+
    '<p class="muted" id="pfMsg" style="margin-top:8px"></p></div></div>';
}

function savePost(no){
  var title=$('pfTitle').value.trim();
  var body=mkValue('pfBody');
  var msg=$('pfMsg');
  if(!title){ msg.textContent='제목을 입력해주세요.'; return; }
  if(!body){ msg.textContent='내용을 입력해주세요.'; return; }

  // 전 직원에게 알림이 가므로 한 번 더 묻는다
  if(!confirm('전 직원에게 알림이 갑니다. 올리시겠습니까?')) return;

  var btn=$('pfSave'); if(btn.disabled) return;
  btn.disabled=true;

  /* 낙관 처리 — 즉시 상단에 반영하고 창을 닫는다. 저장은 뒤에서 */
  var nowS=todayStr()+' '+nowHM();
  var tmpNo=no||('_tmp'+Date.now());
  var np={ no:tmpNo, kind:'공지', corp:'', title:title, body:body,
           who:(S.me&&S.me.name)||'', phone:(S.me&&S.me.phone)||'',
           at:nowS, edited:no? nowS : '' };

  var backNotice = S.data ? (S.data.notices||[]).slice() : null;
  var backPosts  = S.postCache ? (S.postCache.posts||[]).slice() : null;

  putPostLocal(np, no);
  closeOk();
  toast(no? '공지가 수정되었습니다' : '공지가 등록되었습니다');

  call('api_savePost', S.token, {
    no:no||'', kind:'공지', corp:'', title:title, body:body
  }, S.corp).then(function(r){
    if(!r.ok){
      // 되돌리고 알린다
      if(backNotice && S.data){ S.data.notices=backNotice; renderNotices(); }
      if(backPosts && S.postCache) S.postCache.posts=backPosts;
      toast('공지 저장 실패: '+r.msg);
      return;
    }
    // 임시 번호를 진짜 번호로 바꾼다
    if(!no) renumberPost(tmpNo, r.no, r.at||nowS);
    softRefresh();
  });
}

/** 공지를 상단 줄과 게시판 캐시에 즉시 반영 */
function putPostLocal(np, isEdit){
  if(S.data){
    var list=(S.data.notices||[]).filter(function(n){ return n.no!==np.no; });
    list.unshift({ no:np.no, title:np.title, body:np.body, who:np.who,
                   phone:np.phone, at:String(np.at).substring(0,10), edited:np.edited||'' });
    S.data.notices=list.slice(0,3);
    renderNotices();
  }
  if(S.postCache){
    var found=false;
    S.postCache.posts=(S.postCache.posts||[]).map(function(x){
      if(x.no!==np.no) return x;
      found=true; return np;
    });
    if(!found) S.postCache.posts.unshift(np);
  }
}

/** 저장이 끝나면 임시 번호를 서버가 준 진짜 번호로 */
function renumberPost(tmpNo, realNo, at){
  if(!realNo) return;
  if(S.data && S.data.notices){
    S.data.notices.forEach(function(n){
      if(n.no===tmpNo){ n.no=realNo; n.at=String(at).substring(0,10); }
    });
    renderNotices();
  }
  if(S.postCache && S.postCache.posts){
    S.postCache.posts.forEach(function(x){ if(x.no===tmpNo){ x.no=realNo; x.at=at; } });
  }
}

function deletePost(no){
  if(!confirm('이 글을 지울까요?\n달린 댓글도 함께 지워지고 되돌릴 수 없습니다.')) return;
  var backN=S.data? (S.data.notices||[]).slice() : null;
  var backP=S.postCache? (S.postCache.posts||[]).slice() : null;

  dropNoticeLocal(no);
  if(S.postCache){
    S.postCache.posts=(S.postCache.posts||[]).filter(function(x){ return x.no!==no; });
    if(S.postCache.comments) delete S.postCache.comments[no];
  }
  toast('삭제되었습니다');
  openBoard();

  call('api_deletePost', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(backN && S.data){ S.data.notices=backN; renderNotices(); }
      if(backP && S.postCache) S.postCache.posts=backP;
      toast('삭제하지 못했습니다: '+r.msg);
      openBoard();
      return;
    }
    if(S.postCache) S.postCacheAt=areaVer('post');
    softRefresh();
  });
}

/* ===================== 댓글 (업무 상세 · 게시글 공용) ===================== */

/**
 * total 을 주면 '댓글 더 보기' 가 붙는다 (업무 상세용).
 * withHead=true 면 제목줄('댓글 N')을 여기서 그린다. 업무 상세는 접기 제목줄에 얹으므로 false.
 * 개수는 어디에 있든 id=cmCount 하나뿐이라 목록과 항상 같이 움직인다.
 */
function commentsHtml(kind, targetId, list, total, withHead){
  list=list||[];
  var all=(total!=null && total>list.length) ? total : list.length;
  var more=(total!=null && total>list.length) ? (total-list.length) : 0;

  var h='';
  if(withHead){
    h+='<h4 class="sech">댓글 '+
       '<span id="cmCount" data-n="'+all+'">'+all+'</span></h4>';
  }
  h+='<div id="cmList">';
  if(!list.length) h+='<p class="muted cmempty" style="font-size:var(--fs-sm);margin:4px 0">아직 댓글이 없습니다</p>';
  list.forEach(function(c){ h+=commentRow(c); });
  h+='</div>';

  if(more){
    h+='<div class="actions" style="margin:6px 0"><button class="btn sm" id="cmMore" '+
       'onclick="loadTaskAll(\''+targetId+'\',\'cmMore\')">댓글 더 보기 ('+more+'건)</button></div>';
  }
  /* 댓글도 서식을 쓸 수 있게 (v44).
     Enter 는 지금처럼 바로 등록, 줄을 바꾸려면 Shift+Enter. */
  h+='<div style="margin-top:10px">'+mkBar('cmText')+
     '<div style="display:flex;gap:6px;align-items:flex-end">'+
     '<div id="cmText" class="mkin one" contenteditable="true" spellcheck="false" '+
       'style="flex:1;min-height:38px" '+
       'onkeydown="cmKey(event,\''+kind+'\',\''+targetId+'\')" '+
       'onkeyup="mkState(\'cmText\')" onmouseup="mkState(\'cmText\')" '+
       'onfocus="mkState(\'cmText\')" onpaste="mkPaste(event)"></div>'+
     '<button class="btn sm pri" onclick="sendComment(\''+kind+'\',\''+targetId+'\')">등록</button>'+
     '</div></div>';
  return h;
}

/** 목록이 바뀌면 개수도 같이 바꾼다 (목록엔 보이는데 0 으로 남던 버그) */
function syncCommentCount(delta){
  var el=$('cmCount'); if(!el) return;
  var n=Number(el.dataset.n||0)+delta;
  if(n<0) n=0;
  el.dataset.n=n;
  el.textContent=n;
}

function commentRow(c){
  var mine = S.me && (S.me.grade>=9 || c.phone===S.me.phone);
  return '<div class="cmt" data-cid="'+esc(c.id||'')+'">'+
    '<div class="d"><b>'+esc(c.who)+'</b>'+
    '<span class="muted">'+esc(shortDate(c.at))+'</span>'+
    (mine && c.id ? '<button class="del" title="댓글 삭제" onclick="deleteComment(\''+c.id+'\')">×</button>':'')+
    '</div><div class="body">'+fmt(c.text)+'</div></div>';
}

/** 댓글칸 자판 — Enter 등록 / Shift+Enter 줄바꿈 / Ctrl+B·U 서식 */
function cmKey(e, kind, targetId){
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    sendComment(kind, targetId);
    return;
  }
  mkKey(e, 'cmText');
}

/** 낙관 처리 — 화면에 먼저 붙이고 뒤에서 보낸다. 실패하면 되돌린다 */
function sendComment(kind, targetId){
  var el=$('cmText'); if(!el) return;
  var text=mkValue('cmText');
  if(!text) return;
  el.innerHTML='';

  var box=$('cmList');
  var ph=box? box.querySelector('.cmempty') : null;
  if(ph) ph.parentNode.removeChild(ph);

  var node=null;
  if(box){
    box.insertAdjacentHTML('beforeend', commentRow({
      id:'', who:(S.me&&S.me.name)||'', phone:(S.me&&S.me.phone)||'',
      text:text, at:todayStr()+' '+nowHM()
    }));
    node=box.lastElementChild;
  }
  syncCommentCount(1);

  call('api_saveComment', S.token, kind, targetId, text, S.corp).then(function(r){
    if(!r.ok){
      if(node && node.parentNode) node.parentNode.removeChild(node);
      syncCommentCount(-1);
      if($('cmText') && !mkValue('cmText')) $('cmText').innerHTML=fmt(text);   // 쓴 글을 잃지 않게
      toast('댓글 저장 실패: '+r.msg);
      return;
    }
    if(node && node.parentNode) node.outerHTML=commentRow(r.comment);

    if(kind==='업무') addCommentLocal(targetId, r.comment);
    softRefresh();

    if(kind==='게시글' && S.postCache){
      if(!S.postCache.comments) S.postCache.comments={};
      if(!S.postCache.comments[targetId]) S.postCache.comments[targetId]=[];
      S.postCache.comments[targetId].push(r.comment);
      S.postCacheAt=areaVer('post');   // 내가 만든 변화는 이미 반영했다
    }
  });
}

function deleteComment(id){
  if(!confirm('이 댓글을 지울까요?')) return;
  var node=document.querySelector('[data-cid="'+id+'"]');
  var mark=node? node.nextSibling : null, par=node? node.parentNode : null;
  if(node && par) par.removeChild(node);      // 먼저 지운다
  syncCommentCount(-1);
  S.taskCache={};
  call('api_deleteComment', S.token, id, S.corp).then(function(r){
    if(!r.ok){
      if(node && par) par.insertBefore(node, mark);   // 되돌린다
      syncCommentCount(1);
      toast('지우지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
    if(S.postCache && S.postCache.comments){
      Object.keys(S.postCache.comments).forEach(function(k){
        S.postCache.comments[k]=S.postCache.comments[k].filter(function(c){ return c.id!==id; });
      });
      S.postCacheAt=areaVer('post');
    }
  });
}

/* ===================== 결재 ===================== */
/** 결재 목록은 워크보드를 받을 때 이미 같이 왔다. 탭에 들어갈 때 서버에 가지 않는다 */
function docSource(){
  if(S.data && S.data.docs) return S.data.docs;
  return S.docs || null;
}

function renderDocs(){
  var r=docSource();
  if(r){ paintDocs(r); prefetchDocs(); }
  else $('docLists').innerHTML='<p class="muted" style="font-size:var(--fs-sm)">불러오는 중...</p>';
}

/**
 * 결재 화면 (v45에서 다시 짬).
 *
 * · 문서 한 건 = 카드 하나. 제목·금액·상태가 한 카드 안에 묶인다
 *   (예전에는 금액이 오른쪽 끝에 떨어져 어느 문서 것인지 눈으로 이어야 했다)
 * · 0건인 구역은 **아예 그리지 않는다.** '없습니다' 를 반복해 빈 공간을 만들지 않는다
 * · 내가 결재할 문서가 있으면 그 구역이 맨 위 — 지금 손대야 할 것이기 때문이다
 */
function paintDocs(r){
  var h='';
  h+=docSec('내가 결재할 문서', r.toAct, true);
  h+=docSec('내가 올린 문서', r.drafts, false);
  h+=docSec('열람 문서', r.others, false);
  if(!h) h='<p class="none big">결재할 문서가 없습니다</p>';
  $('docLists').innerHTML=h;
}

/** 상태 뱃지 — 대기(노랑) · 승인완료(무채색) · 반려(빨강) */
function docBadge(st){
  var s=String(st||'진행중');
  var cls=(s==='반려')?'dg':(s==='승인완료'?'gy':'wn');
  return '<span class="tag '+cls+'">'+esc(s)+'</span>';
}

function docSec(title, arr, hot){
  arr = arr || [];
  if(!arr.length) return '';                 // 0건이면 구역 자체를 만들지 않는다
  var h='<div class="sec"><h4'+(hot?' class="hot"':'')+'>'+title+'</h4>'+
        '<span class="n">'+arr.length+'</span></div>';
  arr.forEach(function(d){
    var sub=[d.who, shortDate(d.at), d.formName].filter(function(x){ return x; }).join(' · ');
    var tags=(d.canRead? '<span class="tag dg">확인 필요</span> ':'')+
             (d.proxy? '<span class="tag wn">대리</span>':'');
    h+='<div class="ucard'+(hot?' hot':'')+'" onclick="openDoc(\''+d.no+'\')">'+
       '<div class="m">'+
         '<p class="t">'+esc(d.title)+'</p>'+
         (sub? '<p class="b">'+esc(sub)+'</p>':'')+
         (tags? '<p class="b">'+tags+'</p>':'')+
       '</div>'+
       '<div class="r">'+
         (d.amount? '<span class="v">'+won(d.amount)+'원</span>':'')+
         '<span class="s">'+docBadge(d.status)+'</span>'+
       '</div></div>';
  });
  return h;
}

/** 목록이 이미 가진 값으로 창을 즉시 띄우고 내역·결재선만 뒤에서 채운다 */
function findDocBrief(no){
  var hit=null;
  var src=docSource();
  if(src){
    ['toAct','drafts','others'].forEach(function(k){
      (src[k]||[]).forEach(function(d){ if(d.no===no) hit=d; });
    });
  }
  if(!hit && S.data){
    (S.data.approvals||[]).forEach(function(a){
      if(a.no===no) hit={no:a.no, title:a.title, amount:a.amount, who:a.who, at:a.at, status:'진행중'};
    });
  }
  return hit;
}

/**
 * 문서 상세는 board 가 이미 통째로 실어 보낸다(`docPack`).
 * 여기서는 거기에 안 담긴 오래된 문서만 뒤에서 채운다.
 */
function prefetchDocs(){
  var src=docSource(); if(!src) return;
  var nos=[];
  ['toAct','drafts','others'].forEach(function(k){
    (src[k]||[]).forEach(function(d){
      if(nos.length>=10) return;
      if(!S.docCache[d.no]) nos.push(d.no);
    });
  });
  if(!nos.length) return;
  var at=areaVer('doc');
  call('api_docDetails', S.token, nos).then(function(r){
    if(!r || !r.ok) return;
    Object.keys(r.docs||{}).forEach(function(k){
      S.docCache[k]=r.docs[k]; S.docCacheAt[k]=at;
    });
  });
}

function openDoc(no){
  var b=findDocBrief(no);
  var cached=S.docCache[no];

  if(cached){
    // 미리 받아둔 것이 있으면 그대로 연다 (왕복 0회)
    $('modal').innerHTML=docSheetHtml(cached.doc, cached);
    if(S.docCacheAt[no]===areaVer('doc')) return;   // 결재 쪽이 안 바뀌었으면 다시 받지 않는다
  } else if(b){
    // 승인 버튼은 board 가 이미 canAct 를 줬으므로 기다리지 않고 바로 그린다
    $('modal').innerHTML=docSheetHtml({
      no:b.no, title:b.title, corp:b.corp||'', who:b.who, at:b.at,
      amount:b.amount, status:b.status, canAct:b.canAct, proxy:b.proxy
    }, null);
  }

  var at=areaVer('doc');
  call('api_docDetail', S.token, no).then(function(r){
    if(!r.ok){ if(!b && !cached) toast(r.msg); return; }
    S.docCache[no]=r; S.docCacheAt[no]=at;
    if(!$('ddBody')){
      if(!b && !cached) $('modal').innerHTML=docSheetHtml(r.doc, r);
      return;
    }
    var keep=$('dcComment')? $('dcComment').value : '';   // 적던 의견을 잃지 않게
    $('ddBody').innerHTML=docDetailBody(r);
    if(keep && $('dcComment')) $('dcComment').value=keep;
  });
}

/**
 * 결재 문서 상세 (v42에서 다시 짬).
 * 라벨 붙여 여섯 줄로 늘어놓던 것을 '누가 언제' 한 줄로 바꾸고,
 * 금액만 큰 글씨로 남긴다. 금액이 없는 양식(인감·휴가)에는 그 줄을 만들지 않는다.
 */
function docSheetHtml(d, r){
  var head=[];
  if(d.who) head.push(d.who);
  if(d.at) head.push(shortDate(d.at));
  if(d.status) head.push({ t:d.status, hot:(d.status==='반려') });
  if(d.formName) head.push(d.formName);
  if(d.corp) head.push(d.corp);
  if(d.no) head.push(d.no);

  return '<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(d.title)+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    byline(head)+
    (d.amount? '<p style="margin:0 0 18px"><b class="num" style="font-size:var(--fs-num-md)">'+
       won(d.amount)+'원</b> <span class="sub">'+esc(wonKo(d.amount))+'</span></p>' : '')+
    '<div id="ddBody">'+ (r? docDetailBody(r) : waitingBody(d)) +'</div>'+
    '</div></div>';
}

/** 내역이 오기 전에 보여줄 것 — 결재할 수 있으면 버튼부터 먼저 */
function waitingBody(d){
  var h='';
  if(d.canAct){
    h+='<div class="field"><label class="fl">의견</label><input type="text" id="dcComment"></div>'+
       (d.proxy? '<p class="none wnv">'+
                 '대리로 처리합니다. 누가 눌렀는지 문서에 남습니다</p>':'')+
       '<div class="actions">'+
       '<button class="btn dg" onclick="actDoc(\''+d.no+'\',\'reject\')">반려</button>'+
       '<button class="btn pri" onclick="actDoc(\''+d.no+'\',\'approve\')">'+
         (d.proxy?'대리 승인':'승인')+'</button></div>';
  }
  return h+'<p class="muted" style="font-size:var(--fs-sm);margin-top:12px">내역 불러오는 중...</p>';
}

function docDetailBody(r){
  var d=r.doc;
  var h='';
  if(d.fields && d.fields.length){
    h+='<div class="kv" style="margin-bottom:14px">';
    d.fields.forEach(function(f){ h+=row(f.name, f.value); });
    h+='</div>';
  }
  if(r.items.length) h+=sechead(d.itemsTitle||'내역', r.items.length);
  r.items.forEach(function(i){
    var sub=[shortDate(i.date), i.kind].filter(function(x){ return x; }).join(' · ');
    h+='<div class="lrow plain"><div class="m"><p class="t">'+esc(i.memo)+'</p>'+
       (sub? '<p class="b">'+esc(sub)+'</p>':'')+'</div>'+
       '<div class="r"><span class="v">'+won(i.amount)+'원</span>'+
       '<span class="s muted">'+esc(wonKo(i.amount))+'</span></div></div>';
  });

  // 영수증 — 눌러서 원본 크기로 크게 볼 수 있게 (v42)
  if(r.files.length){
    h+='<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">';
    r.files.forEach(function(f, i2){
      h+=receiptThumb(f.url, i2);
    });
    h+='</div>';
  }

  h+=sechead('결재선');
  r.lines.forEach(function(l){
    var st=[l.state, l.at? shortDate(l.at):''].filter(function(x){ return x; }).join(' · ');
    h+='<div class="lrow plain"><div class="m"><p class="t">'+esc(l.name)+
       ' <span class="tag gy">'+esc(l.role)+'</span></p></div>'+
       (st? '<div class="r"><span class="b">'+esc(st)+'</span></div>':'')+'</div>';
  });

  // 내가 아직 확인하지 않은 열람자라면 큰 버튼을 먼저 보여준다
  var viewers = r.viewers || [];
  var needRead = viewers.some(function(v){ return v.mine && !v.done; });
  if(needRead){
    h+='<div style="margin-top:14px">'+
       '<button class="btn pri" style="width:100%;padding:14px;font-size:var(--fs-h1)" '+
       'onclick="readDoc(\''+d.no+'\')">열람 확인</button></div>';
  }
  if(viewers.length){
    h+='<p class="sub" style="margin:8px 0 0;font-size:var(--fs-sm)">열람 · '+
       viewers.map(function(v){
         return esc(v.name)+' '+(v.done? ('확인'+(v.at?' '+esc(shortDate(v.at)):'')) : '미확인');
       }).join(' / ')+'</p>';
  }

  // 승인이 끝난 문서 — 시스템이 찍은 법인 도장과 문서 내려받기
  if(d.status==='승인완료'){
    if(d.seal){
      h+='<div style="margin-top:16px;display:flex;justify-content:flex-end;align-items:center;gap:12px">'+
         (d.done? '<span class="sub" style="font-size:var(--fs-body)">'+esc(String(d.done).substring(0,10))+' 승인</span>':'')+
         '<img src="'+esc(d.seal)+'" alt="법인 도장" '+
         'style="width:74px;height:74px;object-fit:contain"></div>';
    }
    h+='<div class="actions" style="margin-top:14px">'+
       '<button class="btn" id="dcPdf" onclick="openDocPdf(\''+d.no+'\')">문서 보기</button>'+
       '<button class="btn" onclick="shareDoc(\''+d.no+'\')">보내기</button></div>'+
       '<p class="muted" id="dcPdfMsg" style="margin:6px 0 0;font-size:var(--fs-sm)"></p>';
  }

  // 결재할 수 있는지는 서버가 판정해서 보낸다 (화면에서 이름을 비교하지 않는다)
  if(r.canAct){
    h+='<div class="field" style="margin-top:14px"><label class="fl">의견</label>'+
       '<input type="text" id="dcComment"></div>'+
       (r.proxy? '<p class="none wnv">'+
                 '대리로 처리합니다. 누가 눌렀는지 문서에 남습니다</p>' : '')+
       '<div class="actions">'+
       '<button class="btn dg" onclick="actDoc(\''+d.no+'\',\'reject\')">반려</button>'+
       '<button class="btn pri" onclick="actDoc(\''+d.no+'\',\'approve\')">'+
         (r.proxy?'대리 승인':'승인')+'</button></div>';
  }

  if(S.me && S.me.grade>=9){
    h+='<div style="margin-top:18px;padding-top:12px;border-top:1px solid var(--line)">'+
       '<button class="btn dg sm" onclick="deleteDoc(\''+d.no+'\',\''+esc(d.title).replace(/'/g,'')+'\')">이 문서 삭제 (관리자)</button>'+
       '</div>';
  }
  return h;
}

/* ---- 영수증 보기 (v42) ----
   드라이브 링크에서 파일 ID 를 뽑아 미리보기를 만든다.
   미리보기를 못 만들면(주소 모양이 다르면) 예전처럼 링크만 보여준다. */
var RCPT={};     // 번호 -> 원본 주소

function driveId(url){
  var m=String(url||'').match(/\/d\/([A-Za-z0-9_\-]{20,})/) ||
        String(url||'').match(/[?&]id=([A-Za-z0-9_\-]{20,})/);
  return m? m[1] : '';
}

function receiptThumb(url, i){
  var id=driveId(url);
  RCPT[i]=url;
  if(!id) return '<a href="'+esc(url)+'" target="_blank" class="btn sm">영수증 보기</a>';
  return '<img src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w400" '+
    'alt="영수증" onclick="openReceipt(\''+esc(id)+'\','+i+')" '+
    'onerror="this.outerHTML=\'<a href=&quot;'+esc(url)+'&quot; target=_blank class=&quot;btn sm&quot;>영수증 보기</a>\'" '+
    'style="width:104px;height:104px;object-fit:cover;border-radius:var(--r);'+
    'border:1px solid var(--line2);cursor:zoom-in;background:var(--field)">';
}

/** 눌러서 크게 — 화면 가득 원본 화질로 */
function openReceipt(id, i){
  var full='https://drive.google.com/thumbnail?id='+id+'&sz=w2400';
  var box=document.createElement('div');
  box.id='rcptView';
  box.style.cssText='position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);'+
    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
  box.innerHTML=
    '<img src="'+esc(full)+'" alt="영수증" '+
      'style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:var(--r-sm)">'+
    '<div style="display:flex;gap:8px">'+
      '<a class="btn sm" href="'+esc(RCPT[i]||full)+'" target="_blank">원본 열기</a>'+
      '<button class="btn sm pri" onclick="closeReceipt()">닫기</button>'+
    '</div>';
  box.addEventListener('click', function(e){ if(e.target===box) closeReceipt(); });
  document.body.appendChild(box);
}
function closeReceipt(){
  var b=$('rcptView');
  if(b && b.parentNode) b.parentNode.removeChild(b);
}

/* ---- 문서 보기 / 보내기 ---- */
var DOCPDF={};   // 이번 접속에서 이미 만든 문서 링크

/** 누를 때만 만든다. 한 번 만든 것은 서버가 첨부에 남겨 다시 쓴다 */
function openDocPdf(no, cb){
  if(DOCPDF[no]){ if(cb) cb(DOCPDF[no]); else window.open(DOCPDF[no],'_blank'); return; }
  var btn=$('dcPdf'), msg=$('dcPdfMsg');
  if(btn) btn.disabled=true;
  if(msg) msg.textContent='문서를 만드는 중입니다...';
  call('api_docPdf', S.token, no).then(function(r){
    if(btn) btn.disabled=false;
    if(!r.ok){ if(msg) msg.textContent=r.msg; else toast(r.msg); return; }
    if(msg) msg.textContent='';
    DOCPDF[no]=r.url;
    if(cb) cb(r.url); else window.open(r.url,'_blank');
  });
}

/** 휴대폰이면 공유 창, 아니면 링크 복사 (앱이 직접 메일을 보내지 않는다) */
function shareDoc(no){
  openDocPdf(no, function(url){
    var d=S.docCache[no];
    var title=(d && d.doc && d.doc.title) || no;
    if(navigator.share){
      navigator.share({ title:title, text:title, url:url }).catch(function(){});
      return;
    }
    var done=function(){ toast('링크를 복사했습니다'); window.open(url,'_blank'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.open(url,'_blank'); });
    } else {
      window.open(url,'_blank');
    }
  });
}

function deleteDoc(no, title){
  if(!confirm('"'+title+'" 문서를 삭제할까요?\n결재선·지출내역·영수증 기록까지 함께 지워지고 되돌릴 수 없습니다.')) return;
  var back=S.data? JSON.parse(JSON.stringify(S.data.docs||null)) : null;
  dropDocLocal(no);
  closeOk(); toast('삭제되었습니다');
  call('api_deleteDoc', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data){ S.data.docs=back; renderDocs(); navCount(); }
      toast('삭제하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/** 열람 확인 — 결재선의 내 '열람' 줄을 '확인' 으로 바꾼다 */
/** 열람 확인 — 눌렀으면 바로 닫는다. 되돌릴 수 있는 동작이다 */
function readDoc(no){
  var back=S.data? JSON.parse(JSON.stringify(S.data.docs||null)) : null;

  // 캐시 안의 열람 현황도 바로 고쳐서 다시 열어도 '확인' 으로 보이게
  var cd=S.docCache[no];
  if(cd && cd.viewers){
    cd.viewers.forEach(function(v){
      if(v.mine && !v.done){ v.done=true; v.at=todayStr().substring(5)+' '+nowHM(); }
    });
  }
  markDocLocal(no, { canRead:false });
  closeOk();
  toast('열람 확인되었습니다');

  call('api_readDoc', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data){ S.data.docs=back; renderDocs(); navCount(); }
      delete S.docCache[no]; delete S.docCacheAt[no];
      toast('확인 처리를 하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/** 결재 목록에서 이 문서 한 건만 고친다 (board 를 기다리지 않는다) */
function markDocLocal(no, patch){
  if(!S.data || !S.data.docs) return;
  var d=S.data.docs;
  ['toAct','drafts','others'].forEach(function(k){
    (d[k]||[]).forEach(function(x){
      if(x.no!==no) return;
      for(var f in patch) x[f]=patch[f];
    });
  });
  // 처리한 문서는 '내가 결재할 문서' 에서 빼고 열람 쪽으로 옮긴다
  if(patch.canAct===false){
    var moved=(d.toAct||[]).filter(function(x){ return x.no===no; });
    d.toAct=(d.toAct||[]).filter(function(x){ return x.no!==no; });
    if(moved.length) d.others=moved.concat(d.others||[]);
    S.data.approvals=(S.data.approvals||[]).filter(function(a){ return a.no!==no; });
  }
  renderBoard(); navCount();
  if(S.view==='doc') renderDocs();
}

/**
 * 승인·반려 — 화면을 먼저 바꾸고 창을 닫는다.
 * 되돌릴 수 있는 동작이고, 정산 반영·휴가 적립·도장은 서버가 확실히 처리하므로
 * 화면이 기다린다고 더 안전해지지 않는다. 실패하면 되돌리고 크게 알린다.
 */
function actDoc(no, action){
  var c=$('dcComment')? $('dcComment').value : '';
  var btns=document.querySelectorAll('.sheet button');
  [].forEach.call(btns,function(b){ b.disabled=true; });   // 두 번 눌리지 않게

  var back=S.data? JSON.parse(JSON.stringify({docs:S.data.docs||null,
                                              apv:S.data.approvals||[]})) : null;
  markDocLocal(no, { canAct:false });
  delete S.docCache[no]; delete S.docCacheAt[no];
  closeOk();
  toast(action==='approve'?'승인되었습니다':'반려되었습니다');

  call('api_actDoc', S.token, no, action, c, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data){ S.data.docs=back.docs; S.data.approvals=back.apv; }
      renderBoard(); navCount(); if(S.view==='doc') renderDocs();
      toast('처리하지 못했습니다: '+r.msg);
      return;
    }
    if(r.status) markDocLocal(no, { status:r.status });
    if(r.final && !r.sealed){
      toast('승인되었습니다 · 이 법인의 도장이 없어 날인은 되지 않았습니다');
    }
    softRefresh();
  });
}

/** 문서 종류 버튼 목록 — 같은 코드·같은 이름이 두 번 나오지 않게 걸러서 준다.
    시트에 겹치는 줄이 남아 있어도 직원 화면에는 한 번만 보이게 하는 안전장치. */
function formList(){
  var seenCode={}, seenName={}, out=[];
  ((S.meta && S.meta.forms) || []).forEach(function(f){
    var c=String(f.code||'').trim();
    var n=String(f.name||'').trim();
    if(!c || seenCode[c]) return;
    seenCode[c]=true;
    if(n && seenName[n]) return;
    if(n) seenName[n]=true;
    out.push(f);
  });
  return out;
}

function openDocForm(code){
  var forms=formList();
  if(!forms.length){ toast('문서 양식이 없습니다. 설정에서 기준정보를 새로고침해주세요.'); return; }
  var f=null;
  forms.forEach(function(x){ if(x.code===(code||forms[0].code)) f=x; });
  if(!f) f=forms[0];

  var corps=S.meta.corps, tasks=(S.data? S.data.tasks:[]);
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(f.name)+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>';

  if(forms.length>1){
    h+='<div class="field"><label class="fl">문서 종류</label><div class="chks">'+
      forms.map(function(x){
        return '<label class="'+(x.code===f.code?'on':'')+'" onclick="openDocForm(\''+x.code+'\')">'+esc(x.name)+'</label>';
      }).join('')+'</div></div>';
  }

  // 인감·휴가는 업무와 상관이 없다. 승인자가 판단할 때 쓰지 않으므로 칸을 만들지 않는다
  var useTask = (f.code!=='SEAL' && f.code!=='LEAVE');

  h+='<input type="hidden" id="dfCode" value="'+esc(f.code)+'">'+
    (useTask? '<div class="grid2">' : '')+
      '<div class="field"><label class="fl req">법인</label><select id="dfCorp">'+
        corps.map(function(c){ return '<option value="'+c.code+'">'+esc(c.name)+'</option>'; }).join('')+
      '</select></div>'+
      (useTask?
        '<div class="field"><label class="fl">관련 업무</label><select id="dfTask">'+
          '<option value="">없음</option>'+
          tasks.map(function(t){ return '<option value="'+t.id+'">'+esc(t.title)+'</option>'; }).join('')+
        '</select></div>' : '<input type="hidden" id="dfTask" value="">')+
    (useTask? '</div>' : '');

  /* ★ 제목 칸 (v42에서 되살림).
     자동 생성만 남겼더니 '지출 57,680원 · 콩나물 350g' 처럼 첫 품목만 남아
     무슨 지출인지 알 수 없었다. 판단이 틀렸으므로 되돌린다.
     빈칸으로 두지 않고 자동 제목을 미리 채워둔다 — 그대로 두면 그게 저장되고,
     고치면 고친 것이 저장된다. 한 번이라도 직접 건드리면 그때부터 덮어쓰지 않는다. */
  h+='<div class="field"><label class="fl req">제목</label>'+
     '<input type="text" id="dfTitle" oninput="DF_TITLE_TOUCHED=1"></div>';

  // 양식별 항목
  (f.fields||[]).forEach(function(fd,i){
    var id='fd_'+i;
    h+='<div class="field"><label class="fl'+(fd.req?' req':'')+'">'+esc(fd.name)+'</label>';
    if(fd.kind==='선택'){
      h+='<select id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">'+
         (fd.req?'':'<option value=""></option>')+
         fd.opts.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('')+
         '</select>';
    } else if(fd.kind==='여러줄'){
      h+='<textarea id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField"></textarea>';
    } else if(fd.kind==='날짜'){
      h+='<input type="date" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">';
    } else if(fd.kind==='숫자'){
      h+='<input type="number" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">';
    } else {
      h+='<input type="text" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">';
    }
    
    h+='</div>';
  });

  if(f.useItems){
    h+='<h4 class="sech">'+esc(f.itemsTitle)+'</h4>'+
       '<div id="dfItems"></div>'+
       '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
       '<button class="btn sm" onclick="addItem()">＋ 줄 추가</button>'+
       '<span id="dfTotal" class="sub"></span></div>';
  }

  // 사진은 영수증이 필요한 양식과 돈이 오가는 양식에만 (인감·휴가는 만들지 않는다)
  var usePhoto = (f.needReceipt || f.useItems);
  if(usePhoto){
    h+='<div class="field" style="margin-top:14px">'+
       '<label class="fl'+(f.needReceipt?' req':'')+'">'+
       (f.needReceipt?'영수증 사진':'첨부 사진')+'</label>'+
       '<input type="file" id="dfPhoto" accept="image/*" capture="environment"></div>';
  }

  h+='<div class="field"><label class="fl">비고</label><input type="text" id="dfMemo"></div>'+
    // ■ 인감이 찍힌 문서가 필요하면 날인 품의서가 자동으로 같이 올라간다
    (f.code!=='SEAL'
      ? '<div class="field"><div class="chks"><label id="dfSeal" '+
        'onclick="this.classList.toggle(\'on\')">회사 인감이 찍힌 문서가 필요합니다</label></div></div>'
      : '')+
    '<div class="actions"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="dfSave" onclick="saveDoc()">상신</button></div>'+
    '<p class="muted" id="dfMsg" style="margin-top:8px"></p></div></div>';

  $('modal').innerHTML=h;
  DF_TITLE_TOUCHED=0;

  /* 무엇을 고치든 자동 제목을 다시 만든다.
     칸마다 oninput 을 붙이지 않고 창 전체에서 한 번만 듣는다
     (＋줄 추가로 나중에 생기는 칸도 저절로 걸린다) */
  var sheet=$('modal').querySelector('.sheet');
  if(sheet){
    sheet.addEventListener('input', syncDocTitle, true);
    sheet.addEventListener('change', syncDocTitle, true);
  }
  if(f.useItems) addItem();
  syncDocTitle();
}

/* ---- 자동 제목 (v42) ---- */
var DF_TITLE_TOUCHED=0;

/** 사용자가 제목을 직접 건드렸으면 그때부터 덮어쓰지 않는다 */
function syncDocTitle(e){
  if(e && e.target && e.target.id==='dfTitle') return;
  if(DF_TITLE_TOUCHED) return;
  var el=$('dfTitle'); if(!el) return;
  el.value=autoDocTitle();
}

/** 서버의 docTitle_ 과 같은 규칙. 지출·구매는 품목이 2개 이상이면 '외 N건' 을 붙인다 */
function autoDocTitle(){
  var code=$('dfCode')? $('dfCode').value : '';
  var f=null; (S.meta.forms||[]).forEach(function(x){ if(x.code===code) f=x; });

  var fields={};
  [].forEach.call(document.querySelectorAll('.dfField'),function(el){
    fields[el.dataset.name]=el.value;
  });

  var items=[], box=$('dfItems');
  if(box){
    [].forEach.call(box.children,function(r){
      var m=r.querySelector('.itMemo').value.trim();
      var a=moneyVal(r.querySelector('.itAmt'));
      if(m||a) items.push({ memo:m, amount:a });
    });
  }
  var total=0; items.forEach(function(i){ total+=Number(i.amount||0); });

  var money = total? (won(total)+'원') : '';
  var first = items.length? String(items[0].memo||'').trim() : '';
  var more  = items.length>1? ('외 '+(items.length-1)+'건') : '';
  var join=function(arr,sep){
    return arr.filter(function(x){ return x && String(x).trim(); }).join(sep);
  };

  var t='';
  if(code==='EXP'||code==='PUR'){
    t=join([join([(code==='EXP')?'지출':'구매', money],' '), join([first,more],' ')],' · ');
  } else if(code==='ADD'){
    var tn='', sel=$('dfTask');
    if(sel && sel.value){
      (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===sel.value) tn=x.title; });
    }
    t=join([tn, join(['추가공사', money],' ')],' ');
  } else if(code==='SEAL'){
    t=join([fields['날인 문서명']||'', '인감 날인'],' ');
  } else if(code==='LEAVE'){
    var s=String(fields['시작일']||''), e2=String(fields['종료일']||'')||s;
    var span='';
    if(s) span=(e2 && e2!==s)? (s.substring(5)+'~'+e2.substring(5)) : s.substring(5);
    t=join([fields['휴가종류']||'', span],' ');
  } else {
    t=join([f? f.name:'', money, first],' · ');
  }
  t=String(t).trim();
  return t || (f? f.name : code);
}

function saveDoc(){
  var code=$('dfCode').value;
  var f=null; (S.meta.forms||[]).forEach(function(x){ if(x.code===code) f=x; });
  var msg=$('dfMsg');

  var items=[];
  var box=$('dfItems');
  if(box){
    [].forEach.call(box.children,function(r){
      var m=r.querySelector('.itMemo').value.trim();
      var a=moneyVal(r.querySelector('.itAmt'));
      if(m||a) items.push({ memo:m, date:r.querySelector('.itDate').value, amount:a });
    });
  }

  var fields={};
  [].forEach.call(document.querySelectorAll('.dfField'),function(el){
    fields[el.dataset.name]=el.value;
  });

  var titleEl=$('dfTitle');
  var title=titleEl? titleEl.value.trim() : '';

  var sealChk=$('dfSeal');
  var p={ formCode:code, corp:$('dfCorp').value, taskId:$('dfTask')?$('dfTask').value:'',
          title:title, memo:$('dfMemo').value, items:items, fields:fields,
          needSeal: !!(sealChk && sealChk.classList.contains('on')) };

  var photoEl=$('dfPhoto');
  if(!title){ msg.textContent='제목을 입력해주세요.'; if(titleEl) titleEl.focus(); return; }
  if(f && f.useItems && !items.length){ msg.textContent=f.itemsTitle+'을(를) 입력해주세요.'; return; }
  if(f && f.needReceipt && !(photoEl && photoEl.files[0])){
    msg.textContent='영수증 사진을 첨부해주세요.'; return;
  }

  /* 돈이 걸린 동작이라 낙관 처리하지 않는다. 서버 확인 후 닫는다.
     대신 버튼을 잠가 두 번 눌리지 않게 하고, 서버는 저장까지만 하고 바로 응답한다. */
  var btn=$('dfSave');
  if(btn.disabled) return;
  btn.disabled=true; btn.textContent='상신 중...'; msg.textContent='';

  var file=photoEl? photoEl.files[0] : null;
  // 사진은 줄이는 데 시간이 걸린다. 몇 단계를 거치든 화면은 '올리는 중' 하나로만 보인다
  if(file) msg.textContent='사진 올리는 중입니다...';

  shrinkReceipt(file).then(function(data){          // ★ 영수증은 사실상 원본 화질로
    if(file && !data){
      btn.disabled=false; btn.textContent='상신';
      msg.textContent='사진을 올리지 못했습니다. 다시 시도해주세요.';
      return null;
    }
    p.photo=data;
    return call('api_saveDoc', S.token, p, S.corp);
  }).then(function(r){
    if(!r) return;                                  // 사진에서 이미 멈춘 경우
    btn.disabled=false; btn.textContent='상신';
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk();
    toast(r.sealNo? '상신되었습니다 · 인감 날인 품의서도 같이 올라갔습니다' : '상신되었습니다');
    addDocLocal(r);                       // 결재 목록은 화면이 가진 값으로 먼저 갱신
    if(S.view==='doc') renderDocs();
    softRefresh();                        // 진짜 데이터는 뒤에서 조용히
  });
}

/** 방금 올린 문서를 화면 목록에 먼저 얹는다 (서버 board 를 기다리지 않는다) */

             status:'진행중', who:who, at:r.at, canAct:false, canRead:false, proxy:false };

  var rows=[row(r.no, r.title, r.amount, r.formName)];
  if(r.sealNo) rows.push(row(r.sealNo, r.sealTitle||'인감 날인', 0, '인감 날인 품의서'));
  S.data.docs.drafts=rows.concat(S.data.docs.drafts||[]);
}

function saveDeputy(phone){
  var btn=$('dpSave'), msg=$('dpMsg');

  btn.disabled=true; msg.textContent='저장 중입니다...';
  call('api_setDeputy', S.token, phone, $('dpSel').value).then(function(r){
    btn.disabled=false;
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk(); toast('저장되었습니다');
    S.setCache=null;            // 낡은 값으로 한 번 그렸다가 바뀌는 깜빡임을 없앤다 (v43)
    renderSettings();
  });
}

/* ---- 법인 도장 그리기 (관리자만) ---- */
var SIGN={ on:false, ctx:null, last:null };

function openSignPad(corp, name){
  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(name)+' 도장</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    '<canvas id="signPad" width="600" height="600" '+
    'style="width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r2);'+
    'background:#FFFFFF;touch-action:none;display:block"></canvas>'+
    '<div class="actions"><button class="btn" onclick="clearSign()">지우기</button>'+
    '<button class="btn pri" id="sgSave" onclick="saveSign(\''+corp+'\')">저장</button></div>'+
    '<p class="muted" id="sgMsg" style="margin-top:8px"></p></div></div>';
  setTimeout(initSign, 30);
}

function initSign(){
  var cv=$('signPad'); if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.lineWidth=10; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#C0272D';
  SIGN.ctx=ctx; SIGN.on=false; SIGN.last=null;

  function pos(e){
    var b=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])||e;
    return { x:(t.clientX-b.left)*(cv.width/b.width), y:(t.clientY-b.top)*(cv.height/b.height) };
  }
  function start(e){ e.preventDefault(); SIGN.on=true; SIGN.last=pos(e); }
  function move(e){
    if(!SIGN.on) return;
    e.preventDefault();
    var p=pos(e);
    ctx.beginPath(); ctx.moveTo(SIGN.last.x,SIGN.last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    SIGN.last=p;
  }
  function end(){ SIGN.on=false; SIGN.last=null; }

  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
}

function clearSign(){
  var cv=$('signPad'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

function saveSign(corp){
  var cv=$('signPad'); if(!cv) return;
  var msg=$('sgMsg'), btn=$('sgSave');
  if(btn.disabled) return;
  btn.disabled=true; msg.textContent='저장 중입니다...';
  call('api_saveSign', S.token, corp, cv.toDataURL('image/png')).then(function(r){
    btn.disabled=false;
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk(); toast('도장이 등록되었습니다');
    S.setCache=null;
    renderSettings();
  });
}

function cfg(key,label,val){
  return '<div class="field"><label class="fl">'+esc(label)+'</label>'+
    '<div style="display:flex;gap:6px">'+
    '<input type="text" id="cfg_'+key+'" value="'+esc(val||'')+'">'+
    '<button class="btn sm" onclick="saveCfg(\''+key+'\')">저장</button></div></div>';
}
function syncNow(){
  var b=$('syncBtn'); b.disabled=true; $('syncMsg').textContent='가져오는 중입니다...';
  call('api_syncNow', S.token).then(function(r){
    b.disabled=false;
    if(!r.ok){ $('syncMsg').textContent=r.msg; return; }
    $('syncMsg').textContent='출퇴근 '+r.att+' · 견적 '+r.est+' 가져왔습니다.';
    refresh(false);
  });
}

function refreshMeta(){
  call('api_refreshMeta', S.token).then(function(r){
    if(!r.ok) return;
    if(r.meta){ S.meta.corps=r.meta.corps; S.meta.types=r.meta.types;
                S.meta.typeAll=r.meta.typeAll; S.meta.sites=r.meta.sites; }
    // 번호표를 전부 새로 만들었으므로 화면이 들고 있던 것도 전부 버린다 (v43)
    S.setCache=null; S.postCache=null; S.postCacheAt=null;
    S.docCache={}; S.docCacheAt={}; S.taskCache={};
    renderFilters(); toast('기준정보를 다시 불러왔습니다');
    refresh(false);
  });
}

function resetPin(phone, name){
  if(!confirm(name+'님의 PIN을 초기화할까요? 등록된 기기도 모두 해제됩니다.')) return;
  call('api_resetPin', S.token, phone).then(function(r){
    if(!r.ok){ toast(r.msg); return; }
    toast('초기화되었습니다'); S.setCache=null; renderSettings();
  });
}

function saveCfg(key){
  call('api_saveSetting', S.token, key, $('cfg_'+key).value.trim()).then(function(r){
    if(!r.ok){ toast(r.msg); return; }
    S.setCache=null;            // 다음에 설정 화면을 열면 새로 받는다 (v43)
    toast('저장되었습니다'); if(key.indexOf('출퇴근')===0) refresh(false);
  });
}

/* ===================== 알림 ===================== */
function showNoti(rows){
  if(!rows) return;
  S.noti=rows;
  var b=$('notiBadge');
  if(rows.length){ b.textContent=rows.length; b.classList.remove('hide'); }
  else b.classList.add('hide');
}
function openNoti(){
  var rows=S.noti||[];
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">알림 '+rows.length+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>';
  if(!rows.length) h+=empty('새 알림이 없습니다');
  rows.forEach(function(n){
    h+='<div class="lrow plain"><div class="m"><p class="t">'+esc(n.text)+'</p>'+
       (n.at? '<p class="b">'+esc(shortDate(n.at))+'</p>':'')+'</div>'+
       '<div class="r"><span class="tag gy">'+esc(n.kind)+'</span></div></div>';
  });
  if(rows.length) h+='<div class="actions"><button class="btn" onclick="readNoti()">모두 읽음</button></div>';
  h+='</div></div>';
  $('modal').innerHTML=h;
}
function readNoti(){
  showNoti([]);            // 화면에서 먼저 지우고
  closeOk();
  call('api_readNotifications', S.token);   // 서버 정리는 뒤에서
}

boot();
</script>
