<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UNION ONE WORK BOARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16130F">
<meta name="color-scheme" content="dark light">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- 아이폰 홈 화면 실행용 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WORK BOARD">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html,body{margin:0;padding:0;height:100%;background:#16130F;overflow:hidden}
  /* 기본은 화면을 꽉 채웁니다. 여기서 벗어나면 안 됩니다. */
  #app{position:fixed;top:0;left:0;width:100%;height:100%;
    border:0;display:block;background:#16130F}

  /* 아이폰 노치·홈바 대응은 반드시 여기(런처)에서 합니다.
     앱 화면(app.html)은 iframe 안에 있어서 env(safe-area-inset-*) 가 언제나 0 입니다.
     그래서 app.html 안에 아무리 적어도 상단바가 상태표시줄에 가려졌습니다.

     ★ iframe 은 이미지처럼 '제 크기를 가진 요소' 입니다.
       top/right/bottom/left 를 네 방향 다 주고 width:auto 로 두면
       화면에 맞춰지지 않고 **기본 크기 300×150 짜리 상자**가 됩니다.
       반드시 width·height 를 calc 로 직접 계산해서 줘야 합니다. */
  @supports (top: env(safe-area-inset-top)){
    #app{
      top:env(safe-area-inset-top, 0px);
      left:env(safe-area-inset-left, 0px);
      width:calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height:calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
  }

  #splash{position:fixed;inset:0;z-index:10;background:#16130F;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;
    transition:opacity .35s ease}
  #splash.gone{opacity:0;pointer-events:none}
  #splash svg{width:88px;height:88px}
  #splash .t{color:#F2F2F4;font-size:14px;letter-spacing:.02em}
  #splash .s{color:#8A8A94;font-size:12px}
  #splash .bar{width:132px;height:3px;border-radius:2px;background:#2B2B31;overflow:hidden}
  #splash .bar i{display:block;width:40%;height:100%;background:#D22B2B;border-radius:2px;
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
  #splash button{margin-top:6px;border:1px solid #454550;background:transparent;color:#B6B6BE;
    padding:9px 16px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="splash">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="120" height="120" rx="26" fill="#1D1D22"/>
    <rect x="26" y="66" width="14" height="28" rx="7" fill="#FFFFFF"/>
    <rect x="53" y="44" width="14" height="50" rx="7" fill="#FFFFFF"/>
    <rect x="80" y="56" width="14" height="38" rx="7" fill="#FFFFFF"/>
    <circle cx="60" cy="28" r="7" fill="#D22B2B"/>
  </svg>
  <div class="t">UNION-ONE WORK BOARD</div>
  <div class="bar"><i></i></div>
  <div class="s" id="msg">불러오는 중입니다</div>
  <button id="retry" style="display:none" onclick="location.reload()">다시 시도</button>
</div>

<iframe id="app" title="UNION ONE WORK BOARD" allow="clipboard-write; camera; geolocation"></iframe>

<script>
/* ------------------------------------------------------------------
 *  앱 화면 주소
 *
 *  2026-08 부터 앱 화면은 구글이 아니라 이 저장소가 띄웁니다.
 *  구글 도메인에서 로그인 화면을 띄우지 않는 것이 목적입니다.
 *
 *  앱스스크립트 주소는 여기가 아니라 app.html 안의 API_URL 에 있습니다.
 *  새로 배포해서 주소가 바뀌면 app.html 을 고치세요.
 * ---------------------------------------------------------------- */
var APP_URL = './app.html';

/* 기기 식별값
   앱이 아니라 이 런처가 들고 있습니다.
   브라우저가 iframe 안의 저장소를 막아도 로그인이 유지되는 이유입니다. */
var KEY = 'unionone_device_v1';
var token = '';
try {
  token = localStorage.getItem(KEY) || '';
  if (!token) {
    token = 'T' + Date.now() + Math.random().toString(36).substr(2, 8);
    localStorage.setItem(KEY, token);
  }
} catch (e) {
  token = 'T' + Date.now() + Math.random().toString(36).substr(2, 8);
}

var frame = document.getElementById('app');
var splash = document.getElementById('splash');
var msg = document.getElementById('msg');
var retry = document.getElementById('retry');

/* ★ 앱 화면의 판 번호 — 화면(app.html)을 고쳐 올릴 때 하나 올리세요.
      sw.js 의 CACHE 번호와 같은 숫자로 맞춰두면 헷갈리지 않습니다.

   예전에는 여기에 Date.now() 를 넣어 **열 때마다 다른 주소**를 만들었습니다.
   "새로 올려도 옛 화면이 뜬다" 를 막으려던 것인데, 대가가 컸습니다.

     · 주소가 매번 달라서 브라우저·서비스워커 캐시가 **한 번도 맞은 적이 없다**
       → 앱을 열 때마다 app.html 225KB 를 통째로 다시 받았습니다
     · 캐시에는 열 때마다 새 칸이 쌓였습니다 (100번 열면 22MB)
       폰 저장 한도에 닿으면 캐시가 통째로 지워집니다
     · 캐시가 맞은 적이 없으니 **오프라인에서는 앱 화면이 아예 안 떴습니다**

   이제 서비스워커가 열 때마다 서버에 "바뀌었나" 를 물어봅니다(no-cache).
   안 바뀌었으면 서버가 '그대로다' 한 줄만 보내므로 옛 화면이 남을 수 없습니다.
   그래서 주소를 매번 바꿀 이유가 없어졌습니다.

   ▶ 이 번호를 안 올려도 새 화면은 그대로 반영됩니다(서비스워커가 확인하므로).
     올리면 확실하게 한 번 더 눌러주는 것뿐이라 부담 없이 두셔도 됩니다. */
var APP_VER = 'v16';

frame.src = APP_URL + '?dt=' + encodeURIComponent(token) + '&v=' + APP_VER;

var done = false;
function hideSplash() {
  if (done) return;
  done = true;
  splash.classList.add('gone');
  setTimeout(function () { splash.style.display = 'none'; }, 400);
}

frame.addEventListener('load', function () {
  // 앱이 '다 그렸다'고 알려주면 바로 걷는다. 신호가 없으면 1.2초 뒤 자동으로.
  setTimeout(hideSplash, 1200);
});

window.addEventListener('message', function (e) {
  if (e && e.data && e.data.ncore === 'ready') hideSplash();
});

// 너무 오래 걸리면 안내 문구를 바꾼다
setTimeout(function () { if (!done) msg.textContent = '서버 응답을 기다리는 중입니다'; }, 6000);
setTimeout(function () {
  if (!done) {
    msg.textContent = '연결이 지연되고 있습니다. 통신 상태를 확인해주세요.';
    retry.style.display = 'block';
  }
}, 15000);

// 서비스워커 등록 (홈 화면 설치에 필요)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function (reg) { reg.update(); })
      .catch(function () {});
  });
}

// 아이폰에서 화면이 튀는 것 방지
document.addEventListener('touchmove', function (e) {
  if (e.target === document.body) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
